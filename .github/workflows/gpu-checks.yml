# The pull request's GPU checks, run by GitHub itself (Dom's form, 2026-10-10: PR CI runs itself, no lane action). A GitHub-hosted runner calls scripts/gpu-run.mjs, which runs
# scripts/gpu-run/pr-checks.sh on a Hugging Face t4-medium job at the PR head: the /zone1/ and open-once smokes, a Pit fight still and the Zone 1 stills, every browser on the NVIDIA
# renderer (the job refuses to run on software GL, exit 11). The result is the `gpu` check. NOT a self-hosted runner: the repo is public and the VPS is production.
#  - A SKIPPED `gpu` IS NOT A GPU CHECK. Without the repo secret HF_TOKEN the `token` job says "NOT RUN" in the run summary and `gpu` is skipped; `gpu` is never a required check
#    while the secret is unset, and a skipped one never counts as GPU-checked (Lead + Auditor 2026-10-10: an exit-0 job would have shown a false green).
#  - Same-repo branches only (a fork's pull request has no HF_TOKEN and its code would run on our account): the `if:` on `gpu`. `pull_request`, never `pull_request_target`.
#  - HF_TOKEN reaches only the `token` probe step and the one gpu-run step, never checkout / setup-node / pip. workflow_dispatch has no `ref` input (a sha could be a fork PR's head,
#    which GitHub serves from the base repo): dispatch from the branch itself.
#  - A newer push cancels the run; gpu-run.mjs cancels its HF job on SIGINT/SIGTERM and always closes with the "HF: N jobs, 0 running, <=$X" line. Never a draft; docs-only diffs skipped.
name: gpu-checks
on:
  pull_request:
    branches: [codex/01a09a76/task-1]
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:
concurrency:
  group: gpu-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  token:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      has: ${{ steps.probe.outputs.has }}
    steps:
      - id: probe
        run: |
          if [ -n "$HF_TOKEN" ]; then echo "has=yes" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "has=no" >> "$GITHUB_OUTPUT"
          echo "### GPU checks NOT RUN" >> "$GITHUB_STEP_SUMMARY"
          echo "The repo secret HF_TOKEN is not set, so nothing ran on the T4 and \`gpu\` is skipped. A skipped gpu is not a GPU check." >> "$GITHUB_STEP_SUMMARY"
          echo "::warning::HF_TOKEN is not set: the GPU checks did not run"
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
  gpu:
    needs: token
    if: needs.token.outputs.has == 'yes' && (github.event_name == 'workflow_dispatch' || (github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}
          sparse-checkout: scripts   # the runner needs scripts/ only; the HF job clones the whole repo itself
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Hugging Face CLI
        run: pip install --quiet 'huggingface_hub==1.7.2'
      - name: GPU checks on the T4
        run: |
          [ -n "$HF_TOKEN" ] || { echo "::error::HF_TOKEN is empty inside gpu: refusing to report a GPU check that did not run"; exit 1; }
          set +e
          node scripts/gpu-run.mjs "$SHA" --timeout 20m -- bash scripts/gpu-run/pr-checks.sh 2>&1 | tee gpu-run.log
          code=${PIPESTATUS[0]}
          {
            echo "### GPU checks on the T4 (exit $code)"
            echo '```'
            grep -E '^(CHECK |gpu-run: (job|renderer|exit|BLOCKER)|HF: )' gpu-run.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $code
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GPU_RUN_OUT: ${{ github.workspace }}/gpu-run-out
          HF_WALL_ROWS_ENV_FILE: /nonexistent
      - name: Stills and receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpu-checks-${{ github.event.pull_request.number || 'dispatch' }}
          path: gpu-run-out/
          if-no-files-found: ignore
          retention-days: 14
