# The release gate minus the real-browser step, on every push and pull request to the live trunk: lint, the node suites
# (including the strategy battery — no scripted one-trick player may beat the warden), the build, the dependency audit and
# the asset budget. The Playwright gate needs a real GPU (its parry and kick steps are wall-clock touch timings; software GL
# stalls the page until the press lands a second late), so it stays in scripts/deploy.sh, which runs it before every deploy
# and then against the live site.
name: quality
on:
  push:
    branches: [codex/01a09a76/task-1]
  pull_request:
    branches: [codex/01a09a76/task-1]
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run quality:ci
