# Measurement-only: run every release check from .quality-gate.json as its own GitHub job, in parallel, on the commit
# given (default: the ref this was dispatched on). Nothing here gates a merge or a deploy — every job continues on
# error and the receipt is a per-check table in the run summary plus one artifact per check. Purpose: learn which of
# the 25 checks are trustworthy on headless Linux and how long each takes there, before anyone lets deploy.sh trust
# this run instead of the Mac's own release checks. Runs on a labelled pull request and on dispatch.
# Per-job conclusions are what matter: the run itself always succeeds (continue-on-error), a failed check is a failed job.
#
# Job budget (Lead 2026-09-29, Dom "solve it"): the repo shares GitHub's 20 concurrent jobs, and run AR's 39 rows sat queued
# > 40 min behind 20 in-progress jobs while deploy.sh runs every row on the Mac anyway (RELEASE_CHECKS_TRUST_CI=0). So:
#   - a pull request runs the row matrix ONLY while it carries the `ci:release-checks` label (Lead applies it when slotting a
#     run, at most 2 PRs at a time): the full matrix on every labelled event, unless its diff triggers no row (docs-only);
#   - no label: `plan` + "release rows (none for this diff)" only; quality.yml (quality, base, browser, load-time) is unchanged;
#   - trunk pushes run nothing here: at 8 wide a trunk matrix took 51–111 min and trunk moves every 1–2 h, so a 2-wide one
#     would be cancelled before it finished — pure spend. Measure trunk by dispatch (`gh workflow run release-checks.yml`);
#   - max-parallel 4: one run never holds more than 4 of the 20.
# Worst case: 2 labelled PRs x 4 + 1 dispatch x 4 = 12 row jobs, >= 8 left for quality.yml; with no dispatch, 8 (>= 12 left).
name: release-checks
on:
  # Pull requests run on the branch head, so that by the time the branch is merged the deploy can trust these checks by
  # tree (scripts/ci-trusted-checks.mjs). Never for drafts. Checks the runner cannot finish in a useful time are left out on
  # pull requests (RUNNER_SKIP_ON_PR); they run on the Mac at deploy time as before. The summary job is RED on a pull request
  # when any row failed: a red row is a defect until it is reproduced on the Mac and shown to be the runner's (AGENTS.md).
  pull_request:
    types: [opened, labeled, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Commit or branch to measure (default: the ref you dispatch from)'
        required: false
        default: ''
# One run per trunk push and one per pull request; a newer push cancels the superseded run (queued or running), like
# quality.yml, and cancel-on-close.yml cancels a closed PR's runs. deploy.sh only ever trusts a job whose run is for the exact
# revision being deployed (scripts/ci-trusted-checks.mjs). Adding any other label (a lane tag) gets a group of its own (the run
# id): it runs nothing, so it must never cancel a labelled PR's row matrix in flight (Lead 2026-09-29).
concurrency:
  group: release-checks-${{ github.event.pull_request.number || github.ref }}-${{ inputs.ref }}${{ github.event.action == 'labeled' && github.event.label.name != 'ci:release-checks' && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: true
env:
  # Release checks the runner takes ~28 min on (80 s on the Mac): never worth waiting for from a pull request.
  RUNNER_SKIP_ON_PR: quiet-one-browser-check
jobs:
  plan:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      checks: ${{ steps.list.outputs.checks }}
      ref: ${{ steps.list.outputs.ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.event.pull_request.head.sha || github.sha }}
      - id: list
        # One matrix entry per release_commands row: index, a short name for the job title, the argv as one string.
        # A pull request without the `ci:release-checks` label runs no rows (the job budget above). A labelled one sends its
        # changed files through scripts/release-rows-for.mjs first: when they trigger no row (a docs-only diff: state docs,
        # briefs, reference images) the matrix is skipped (Strategy 2026-09-23); otherwise the full matrix runs. The `rows` job
        # reports "0 rows" when nothing runs. An empty matrix means "nothing to run" and the check job is skipped.
        # `ref` is what every check job checks out: the branch head on a pull request, never refs/pull/N/merge — GitHub
        # deletes that ref the moment the PR merges, and rows still queued then died in checkout (18 of #439's 32).
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_ACTION: ${{ github.event.action }}
          PR_LABEL: ${{ github.event.label.name }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          RUN_REF: ${{ inputs.ref || github.event.pull_request.head.sha || github.sha }}
        run: |
          node -e '
            const { execFileSync } = require("child_process");
            const gate = require("./.quality-gate.json");
            const pr = process.env.GITHUB_EVENT_NAME === "pull_request";
            let run = true;
            const labelled = pr && process.env.PR_LABELS.split(",").includes("ci:release-checks");
            // No label: no rows, whatever the event. Another label being added (merged-elsewhere, a lane tag) is not a request either.
            if (pr && !labelled) { run = false; console.log("no ci:release-checks label: release rows not run (Lead labels a PR when slotting its run)"); }
            else if (pr && process.env.PR_ACTION === "labeled" && process.env.PR_LABEL !== "ci:release-checks") { run = false; console.log(`label ${process.env.PR_LABEL} added: not a request to run the rows`); }
            if (pr && run) {
              // A labelled PR whose changed files trigger no row (release_triggers in .quality-gate.json, printed locally by
              // scripts/release-rows-for.mjs) still runs nothing: a docs-only diff.
              const files = execFileSync("gh", ["api", `repos/${process.env.GITHUB_REPOSITORY}/pulls/${process.env.PR_NUMBER}/files`, "--paginate", "--jq", ".[].filename"], { encoding: "utf8" }).split("\n").filter(Boolean);
              const triggered = JSON.parse(execFileSync("node", ["scripts/release-rows-for.mjs", "--json", ...files], { encoding: "utf8" }));
              if (!triggered.length) { run = false; console.log(`${files.length} changed file(s) trigger no release rows (they run at deploy): matrix skipped`); }
              else console.log(`${process.env.PR_ACTION}, labelled: full matrix (the diff triggers rows ${triggered.map(c => c.index).join(", ")})`);
            }
            const skip = pr ? (process.env.RUNNER_SKIP_ON_PR || "").split(/[\s,]+/).filter(Boolean) : [];
            const checks = !run ? [] : (gate.release_commands.map((command, i) => ({
              index: i + 1,
              name: (command.find(a => a.endsWith(".mjs")) || command[0]).replace(/^(scripts|artifacts)\//, "").replace(/\.mjs$/, "").replace(/[^\w.-]+/g, "_").slice(0, 40),
              argv: JSON.stringify(command),
            }))).filter(check => !skip.some(name => check.name.includes(name)));
            require("fs").appendFileSync(process.env.GITHUB_OUTPUT, "checks=" + JSON.stringify(checks) + "\nref=" + process.env.RUN_REF + "\n");
          '
  rows:
    # The visible receipt when nothing runs: one green job, under a minute, saying so — a PR page with no matrix job at all
    # reads as "CI never ran".
    needs: plan
    if: github.event_name == 'pull_request' && needs.plan.outputs.checks == '[]'
    name: release rows (none for this diff)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: echo "0 release rows run for this pull request (no ci:release-checks label, another label added, or a diff that triggers no row) — every row runs on the Mac at deploy (scripts/deploy.sh). Lead adds ci:release-checks when slotting a run."
  check:
    needs: plan
    if: needs.plan.outputs.checks != '[]'
    strategy:
      fail-fast: false
      # One run never holds more than 4 of the repo's 20 concurrent jobs (the budget in the header).
      max-parallel: 4
      matrix:
        check: ${{ fromJson(needs.plan.outputs.checks) }}
    name: check ${{ matrix.check.index }} (${{ matrix.check.name }})
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Lead 2026-09-28 (#1018 check 44): the runner image's Microsoft apt source answered 403 ("repository no longer signed") and
      # apt failed every row that installs chromium's deps. That list is not needed here, so it goes before any apt call. Actions runs
      # bash with pipefail, hence the || true when grep finds nothing.
      - name: Drop the Microsoft apt source
        run: grep -ls packages.microsoft.com /etc/apt/sources.list.d/* 2>/dev/null | xargs -r sudo rm -f || true
      - run: npx playwright install --with-deps chromium
      # Row 49 (browser-replay-check --engine webkit, Strategy 2026-09-29): Safari's engine, installed only for the rows that name it.
      - if: contains(matrix.check.argv, 'webkit')
        run: npx playwright install --with-deps webkit
      - name: Lossless JPEG build tool and ffmpeg (arena-audio-check spawns ffmpeg)
        run: sudo apt-get install -y libjpeg-turbo-progs ffmpeg
      - run: npm run build
      - name: Release check ${{ matrix.check.index }}
        env:
          CHECK_INDEX: ${{ matrix.check.index }}
          CHECK_ARGV: ${{ matrix.check.argv }}
          CHECK_NAME: ${{ matrix.check.name }}
        # Same argv the Mac runs, timed; the receipt is written whether it passes or not.
        run: |
          PG_BIN="$(pg_config --bindir 2>/dev/null || true)" node -e '
            const { spawnSync } = require("child_process");
            const argv = JSON.parse(process.env.CHECK_ARGV);
            const started = Date.now();
            const result = spawnSync(argv[0], argv.slice(1), { stdio: "inherit", env: { ...process.env, PG_BIN: process.env.PG_BIN } });
            const seconds = Math.round((Date.now() - started) / 100) / 10;
            const status = result.status ?? 1;
            require("fs").mkdirSync("artifacts", { recursive: true });
            // sha/tree are what the job actually checked out (a pull_request run checks out the merge ref, a dispatch
            // may name another ref): deploy.sh trusts a receipt only for the tree it is deploying.
            const rev = a => require("child_process").execFileSync("git", ["rev-parse", a], { encoding: "utf8" }).trim();
            require("fs").writeFileSync(`artifacts/release-check-${process.env.CHECK_INDEX}.json`,
              JSON.stringify({ index: Number(process.env.CHECK_INDEX), name: process.env.CHECK_NAME, command: argv.join(" "), seconds, status, runner: "ubuntu-latest", sha: rev("HEAD"), tree: rev("HEAD^{tree}"), event: process.env.GITHUB_EVENT_NAME }) + "\n");
            console.log(`check ${process.env.CHECK_INDEX} ${status === 0 ? "passed" : "FAILED (exit " + status + ")"} in ${seconds}s`);
            process.exit(status);
          '
      # The two uploads never colour the job (Auditer, 2026-09-28): GitHub's artifact service timed out five times on #1015's
      # check 1 after "check 1 passed", and the red upload step showed the passed row as FAILURE to `gh pr checks` and to Deploy's
      # strict-green watchers. The row's own result is the "Release check N" step and its receipt; a lost receipt is handled
      # downstream: ci-trusted-checks.mjs reads a missing receipt as not trusted (the row runs on the Mac) and the summary job
      # below is red on a pull request for any planned row without one.
      - if: always()
        continue-on-error: true
        # The receipt alone, tiny: what deploy.sh downloads (scripts/ci-trusted-checks.mjs).
        uses: actions/upload-artifact@v4
        with:
          name: release-check-${{ matrix.check.index }}-receipt
          path: artifacts/release-check-${{ matrix.check.index }}.json
          if-no-files-found: ignore
      - if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: release-check-${{ matrix.check.index }}
          path: |
            artifacts/release-check-${{ matrix.check.index }}.json
            artifacts/**/*.json
            artifacts/**/*.jpg
            artifacts/**/*.png
            artifacts/**/*.webm
          if-no-files-found: ignore
  summary:
    needs: [plan, check]
    # Not when the matrix never ran (a docs-only PR push): a red "summary" there means nothing.
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.checks != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-check-*
          path: receipts
      - name: Per-check table
        run: |
          node -e '
            const fs = require("fs"), path = require("path");
            const rows = [];
            // Either upload of a check may have failed without colouring its job (continue-on-error above): read the full
            // artifact first, the tiny receipt as the fallback, and a planned row with neither is a failed row on a pull request.
            const seen = new Set();
            for (const dir of fs.existsSync("receipts") ? fs.readdirSync("receipts").sort((a, b) => a.endsWith("-receipt") - b.endsWith("-receipt")) : []) {
              const stem = dir.replace(/-receipt$/, ""), file = path.join("receipts", dir, `${stem}.json`);
              if (seen.has(stem) || !fs.existsSync(file)) continue;
              seen.add(stem); rows.push(JSON.parse(fs.readFileSync(file, "utf8")));
            }
            for (const c of JSON.parse(process.env.PLANNED || "[]")) if (!rows.some(r => Number(r.index) === Number(c.index))) rows.push({ index: c.index, name: c.name, seconds: 0, status: "no receipt" });
            rows.sort((a, b) => b.seconds - a.seconds);
            const passed = rows.filter(r => r.status === 0).length;
            const lines = [
              `## Release checks on ubuntu-latest — ${passed}/${rows.length} passed, longest ${rows[0]?.seconds ?? 0}s`,
              "", "| # | check | seconds | result |", "|---|---|---:|---|",
              ...rows.map(r => `| ${r.index} | ${r.name} | ${r.seconds} | ${r.status === 0 ? "pass" : "FAIL (exit " + r.status + ")"} |`),
              "", process.env.GITHUB_EVENT_NAME === "pull_request"
                ? "On a pull request this job is red when any row failed: reproduce the row on the Mac (its argv is in .quality-gate.json) before merging — a red row is a defect until shown to be the runner (#435)."
                : "Measurement only on a dispatch: this run gates nothing. Compare against the Mac receipt in artifacts/release-checks.json before trusting any check here.",
            ];
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join("\n") + "\n");
            fs.writeFileSync("release-checks-summary.json", JSON.stringify({ sha: process.env.GITHUB_SHA, checks: rows.sort((a, b) => a.index - b.index) }) + "\n");
            console.log(lines.join("\n"));
            if (process.env.GITHUB_EVENT_NAME === "pull_request" && passed < rows.length) { console.log(`::error::${rows.length - passed} release row(s) failed on this pull request`); process.exitCode = 1; }
          '
        env:
          GITHUB_SHA: ${{ needs.plan.outputs.ref }}
          PLANNED: ${{ needs.plan.outputs.checks }}
      # One combined receipt per run: scripts/ci-trusted-checks.mjs downloads this single artifact and trusts a check
      # only when its own receipt says status 0, in addition to the job being green.
      - uses: actions/upload-artifact@v4
        with:
          name: release-checks-summary
          path: release-checks-summary.json
