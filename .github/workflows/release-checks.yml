# Measurement-only: run every release check from .quality-gate.json as its own GitHub job, in parallel, on the commit
# given (default: the ref this was dispatched on). Nothing here gates a merge or a deploy — every job continues on
# error and the receipt is a per-check table in the run summary plus one artifact per check. Purpose: learn which of
# the 25 checks are trustworthy on headless Linux and how long each takes there, before anyone lets deploy.sh trust
# this run instead of the Mac's own release checks. Runs on every trunk push (free on a public repo) and on dispatch.
# Per-job conclusions are what matter: the run itself always succeeds (continue-on-error), a failed check is a failed job.
name: release-checks
on:
  push:
    branches: [codex/01a09a76/task-1]
  # Pull requests run too, on the branch head, so that by the time the branch is merged the deploy can already trust
  # these checks by tree (scripts/ci-trusted-checks.mjs). When it is opened ready, marked ready or reopened, and on every
  # later push unless that push touches only docs (docs/** and *.md): #435 merged on a head whose matrix had never run
  # (the run fires only on open, the label was never added) and failed nine rows at deploy. Never for drafts. Checks the
  # runner cannot finish in a useful time are left out on pull requests (RUNNER_SKIP_ON_PR); they run on the Mac at
  # deploy time as before. The `ci:release-checks` label still forces a run on a docs-only push.
  # The summary job is RED on a pull request when any row failed: a red row is a defect until it is reproduced on the
  # Mac and shown to be the runner's (AGENTS.md, the merge gate).
  pull_request:
    types: [opened, labeled, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Commit or branch to measure (default: the ref you dispatch from)'
        required: false
        default: ''
# One run per trunk push; a newer push cancels the older run, like quality.yml. deploy.sh only ever trusts a
# job whose run is for the exact revision being deployed (scripts/ci-trusted-checks.mjs).
concurrency:
  group: release-checks-${{ github.ref }}-${{ inputs.ref }}
  cancel-in-progress: true
env:
  # Release checks the runner takes ~28 min on (80 s on the Mac): never worth waiting for from a pull request.
  RUNNER_SKIP_ON_PR: quiet-one-browser-check
jobs:
  plan:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      checks: ${{ steps.list.outputs.checks }}
      ref: ${{ steps.list.outputs.ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.event.pull_request.head.sha || github.sha }}
      - id: list
        # One matrix entry per release_commands row: index, a short name for the job title, the argv as one string.
        # On a pull request's later push (synchronize) the matrix runs unless every changed file is docs (docs/** or *.md);
        # the `ci:release-checks` label forces it. An empty matrix means "nothing to run" and the check job is skipped.
        # `ref` is what every check job checks out: the branch head on a pull request, never refs/pull/N/merge — GitHub
        # deletes that ref the moment the PR merges, and rows still queued then died in checkout (18 of #439's 32).
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_ACTION: ${{ github.event.action }}
          PR_LABEL: ${{ github.event.label.name }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          RUN_REF: ${{ inputs.ref || github.event.pull_request.head.sha || github.sha }}
        run: |
          node -e '
            const { execFileSync } = require("child_process");
            const gate = require("./.quality-gate.json");
            const pr = process.env.GITHUB_EVENT_NAME === "pull_request";
            let run = true;
            // Another label (merged-elsewhere, a lane tag) is not a request to run the matrix.
            if (pr && process.env.PR_ACTION === "labeled" && process.env.PR_LABEL !== "ci:release-checks") run = false;
            if (pr && process.env.PR_ACTION === "synchronize" && !process.env.PR_LABELS.split(",").includes("ci:release-checks")) {
              const files = execFileSync("gh", ["api", `repos/${process.env.GITHUB_REPOSITORY}/pulls/${process.env.PR_NUMBER}/files`, "--paginate", "--jq", ".[].filename"], { encoding: "utf8" }).split("\n").filter(Boolean);
              run = files.some(f => !(f.startsWith("docs/") || f.endsWith(".md")));
              console.log(run ? `push touches ${files.filter(f => !(f.startsWith("docs/") || f.endsWith(".md"))).length} non-doc file(s): running` : "docs-only push: nothing to run");
            }
            const skip = pr ? (process.env.RUNNER_SKIP_ON_PR || "").split(/[\s,]+/).filter(Boolean) : [];
            const checks = !run ? [] : gate.release_commands.map((command, i) => ({
              index: i + 1,
              name: (command.find(a => a.endsWith(".mjs")) || command[0]).replace(/^(scripts|artifacts)\//, "").replace(/\.mjs$/, "").replace(/[^\w.-]+/g, "_").slice(0, 40),
              argv: JSON.stringify(command),
            })).filter(check => !skip.some(name => check.name.includes(name)));
            require("fs").appendFileSync(process.env.GITHUB_OUTPUT, "checks=" + JSON.stringify(checks) + "\nref=" + process.env.RUN_REF + "\n");
          '
  check:
    needs: plan
    if: needs.plan.outputs.checks != '[]'
    strategy:
      fail-fast: false
      # Leave runners for every lane's required quality.yml jobs (pool cap is 20).
      max-parallel: 8
      matrix:
        check: ${{ fromJson(needs.plan.outputs.checks) }}
    name: check ${{ matrix.check.index }} (${{ matrix.check.name }})
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Lossless JPEG build tool and ffmpeg (arena-audio-check spawns ffmpeg)
        run: sudo apt-get install -y libjpeg-turbo-progs ffmpeg
      - run: npm run build
      - name: Release check ${{ matrix.check.index }}
        env:
          CHECK_INDEX: ${{ matrix.check.index }}
          CHECK_ARGV: ${{ matrix.check.argv }}
          CHECK_NAME: ${{ matrix.check.name }}
        # Same argv the Mac runs, timed; the receipt is written whether it passes or not.
        run: |
          PG_BIN="$(pg_config --bindir 2>/dev/null || true)" node -e '
            const { spawnSync } = require("child_process");
            const argv = JSON.parse(process.env.CHECK_ARGV);
            const started = Date.now();
            const result = spawnSync(argv[0], argv.slice(1), { stdio: "inherit", env: { ...process.env, PG_BIN: process.env.PG_BIN } });
            const seconds = Math.round((Date.now() - started) / 100) / 10;
            const status = result.status ?? 1;
            require("fs").mkdirSync("artifacts", { recursive: true });
            // sha/tree are what the job actually checked out (a pull_request run checks out the merge ref, a dispatch
            // may name another ref): deploy.sh trusts a receipt only for the tree it is deploying.
            const rev = a => require("child_process").execFileSync("git", ["rev-parse", a], { encoding: "utf8" }).trim();
            require("fs").writeFileSync(`artifacts/release-check-${process.env.CHECK_INDEX}.json`,
              JSON.stringify({ index: Number(process.env.CHECK_INDEX), name: process.env.CHECK_NAME, command: argv.join(" "), seconds, status, runner: "ubuntu-latest", sha: rev("HEAD"), tree: rev("HEAD^{tree}"), event: process.env.GITHUB_EVENT_NAME }) + "\n");
            console.log(`check ${process.env.CHECK_INDEX} ${status === 0 ? "passed" : "FAILED (exit " + status + ")"} in ${seconds}s`);
            process.exit(status);
          '
      - if: always()
        # The receipt alone, tiny: what deploy.sh downloads (scripts/ci-trusted-checks.mjs).
        uses: actions/upload-artifact@v4
        with:
          name: release-check-${{ matrix.check.index }}-receipt
          path: artifacts/release-check-${{ matrix.check.index }}.json
          if-no-files-found: ignore
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-check-${{ matrix.check.index }}
          path: |
            artifacts/release-check-${{ matrix.check.index }}.json
            artifacts/**/*.json
            artifacts/**/*.jpg
            artifacts/**/*.png
            artifacts/**/*.webm
          if-no-files-found: ignore
  summary:
    needs: [plan, check]
    # Not when the matrix never ran (a docs-only PR push): a red "summary" there means nothing.
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.checks != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-check-*
          path: receipts
      - name: Per-check table
        run: |
          node -e '
            const fs = require("fs"), path = require("path");
            const rows = [];
            for (const dir of fs.existsSync("receipts") ? fs.readdirSync("receipts") : []) {
              if (dir.endsWith("-receipt")) continue;
              const file = path.join("receipts", dir, `${dir}.json`);
              if (fs.existsSync(file)) rows.push(JSON.parse(fs.readFileSync(file, "utf8")));
            }
            rows.sort((a, b) => b.seconds - a.seconds);
            const passed = rows.filter(r => r.status === 0).length;
            const lines = [
              `## Release checks on ubuntu-latest — ${passed}/${rows.length} passed, longest ${rows[0]?.seconds ?? 0}s`,
              "", "| # | check | seconds | result |", "|---|---|---:|---|",
              ...rows.map(r => `| ${r.index} | ${r.name} | ${r.seconds} | ${r.status === 0 ? "pass" : "FAIL (exit " + r.status + ")"} |`),
              "", process.env.GITHUB_EVENT_NAME === "pull_request"
                ? "On a pull request this job is red when any row failed: reproduce the row on the Mac (its argv is in .quality-gate.json) before merging — a red row is a defect until shown to be the runner (#435)."
                : "Measurement only on a trunk push: this run gates nothing. Compare against the Mac receipt in artifacts/release-checks.json before trusting any check here.",
            ];
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join("\n") + "\n");
            fs.writeFileSync("release-checks-summary.json", JSON.stringify({ sha: process.env.GITHUB_SHA, checks: rows.sort((a, b) => a.index - b.index) }) + "\n");
            console.log(lines.join("\n"));
            if (process.env.GITHUB_EVENT_NAME === "pull_request" && passed < rows.length) { console.log(`::error::${rows.length - passed} release row(s) failed on this pull request`); process.exitCode = 1; }
          '
        env:
          GITHUB_SHA: ${{ needs.plan.outputs.ref }}
      # One combined receipt per run: scripts/ci-trusted-checks.mjs downloads this single artifact and trusts a check
      # only when its own receipt says status 0, in addition to the job being green.
      - uses: actions/upload-artifact@v4
        with:
          name: release-checks-summary
          path: release-checks-summary.json
