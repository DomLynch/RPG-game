# The unit suite (`npm run test:all`, every tests/*.test.ts) split over 8 GitHub runners with node's --test-shard (Dom 2026-10-12, ci-runners-first: 9.5 min on the VPS, target under 4).
# The last job sums the shards into ONE receipt in the VPS unit receipt's shape (sha, tree, pass, fail, exit, seconds, node; scripts/lib/ci-unit.mjs) and uploads it as the
# `unit-receipt` artifact. scripts/deploy.sh trusts it through scripts/ci-unit-trust.mjs: a green run of THIS workflow on a commit with the deploy tree. The quality
# workflow still runs test:all; this one is the faster, receipt-bearing path and does not replace it until the Auditor says so.
name: unit-ci
on:
  push:
    branches: [codex/01a09a76/task-1]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [codex/01a09a76/task-1]
    types: [opened, synchronize, reopened]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:
concurrency:
  group: unit-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  UNIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
jobs:
  static:
    # Static first (Lead + Strategy 2026-10-12, runner budget): eslint + both typechecks + the origins lint, about a minute. On a pull request the 8
    # shards `needs:` it, so a red tsc costs this one job, not 9. A push or a dispatch skips it and the shards run as before.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.UNIT_SHA }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx eslint src
      - run: npm run typecheck:tests
      - run: npm run typecheck:origins
      - run: npm run lint:origins
  shard:
    needs: static
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.static.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      # The PR HEAD, not the merge ref: the receipt is bound to the tree of that sha, and deploy.sh matches trees.
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.UNIT_SHA }}
      # The exact node the VPS receipt is pinned to (NODE_PIN): record/replay fingerprints depend on its float behaviour.
      - id: pin
        run: echo "node=$(node -e "import('./scripts/lib/vps-unit.mjs').then((m) => console.log(m.NODE_PIN.version.slice(1)))")" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.pin.outputs.node }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Drop the Microsoft apt source
        run: grep -ls packages.microsoft.com /etc/apt/sources.list.d/* 2>/dev/null | xargs -r sudo rm -f || true
      - name: Lossless JPEG build tool
        run: sudo apt-get update && sudo apt-get install -y libjpeg-turbo-progs
      - name: Run this shard
        run: |
          t0=$(date +%s)
          set +e
          node --test --test-shard=${{ matrix.shard }}/8 tests/*.test.ts 2>&1 | tee unit.log
          rc=${PIPESTATUS[0]}
          set -e
          mkdir -p out
          node scripts/ci-unit-shard.mjs unit.log ${{ matrix.shard }} 8 "$rc" "$(( $(date +%s) - t0 ))" out/shard-${{ matrix.shard }}.json
          grep -E '^not ok' unit.log | grep -v '# TODO' | head -40 || true
          exit "$rc"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-shard-${{ matrix.shard }}
          path: out/shard-${{ matrix.shard }}.json
          if-no-files-found: ignore
  receipt:
    needs: shard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.UNIT_SHA }}
          fetch-depth: 1
          sparse-checkout: |
            scripts
            package.json
      - uses: actions/download-artifact@v4
        with:
          pattern: unit-shard-*
          path: shards
          merge-multiple: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
      - run: node scripts/ci-unit-receipt.mjs shards unit-receipt.json
      - uses: actions/upload-artifact@v4
        with:
          name: unit-receipt
          path: unit-receipt.json
