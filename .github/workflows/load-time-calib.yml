name: load-time-calib
# One-off calibration (not for merge): the load-time gate on this tree's dist (== trunk's) and on live, same runner.
on:
  push:
    branches: [web/load-time-calib]
jobs:
  calib:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get install -y libjpeg-turbo-progs
      - run: npm run build
      - name: local dist
        run: node scripts/load-time-check.mjs; cp artifacts/load-time/receipt.json local.json
      - name: live
        if: always()
        run: QA_URL=https://frankendom.com/ node scripts/load-time-check.mjs; cp artifacts/load-time/receipt.json live.json
      - name: local dist again
        if: always()
        run: node scripts/load-time-check.mjs; cp artifacts/load-time/receipt.json local2.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calib
          path: '*.json'
