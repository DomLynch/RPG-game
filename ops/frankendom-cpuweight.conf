# Installed by ops/install-cpuweight.sh as /etc/systemd/system/<unit>.service.d/10-cpuweight.conf for the three live services. Under cgroup v2 a lane job's own nice cannot take CPU
# from a unit with a higher weight (default 100), so a Chromium/Playwright burst on the shared box cannot starve a live duel, a world kill or a login (Lead 2026-10-21, after three Chromium -8 incidents).
[Service]
CPUWeight=1000
