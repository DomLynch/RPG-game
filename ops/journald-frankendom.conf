# Frankendom's journald drop-in, installed by ops/install-journald.sh as /etc/systemd/journald.conf.d/zz-frankendom.conf (the zz- prefix sorts it LAST, so these values win over size.conf's
# 500M and elite-trader.conf's 512M, both of which stay untouched: elite-trader is another project's file on this shared box).
# 2026-10-13: the journal sat at its 500M cap and rotated about every 3 days (oldest entry 10 Oct), so a unit's history, e.g. the 102 presence restarts, could not be explained afterwards.
# Storage is already persistent on this box (/var/log/journal exists); it is pinned here so a default change cannot silently make it volatile.
[Journal]
Storage=persistent
SystemMaxUse=1G
SystemMaxFileSize=128M
MaxRetentionSec=30day
