# Included ONLY inside the frankendom.com :443 server block (ops/install-origins-writer.sh): the Origins writer is reachable over TLS only, as
# POST https://frankendom.com/origins/<op>. The writer listens on 127.0.0.1:8788 and verifies the caller's Supabase token itself; with the flag OFF
# or the account off the allowlist the database answers 403 anyway. Needs the http-level zone in /etc/nginx/conf.d/frankendom-origins-limits.conf.
# X-Real-IP is overwritten here so nothing a client sends can name its own address.
location ~ "^/origins/[a-z_]{1,32}$" {
    limit_except POST { deny all; }
    limit_req zone=frankendom_origins burst=10 nodelay;
    limit_req_status 429;
    client_max_body_size 64k;
    proxy_pass http://127.0.0.1:8788;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 35s;   # the writer's psql calls time out at 30 s
    proxy_send_timeout 35s;
    proxy_buffering off;
}
