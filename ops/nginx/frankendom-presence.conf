# Included ONLY inside the frankendom.com :443 server block (the way ops/install-duel-relay.sh includes the relay's snippet), so presence is reachable over TLS only
# (wss://frankendom.com/origins/presence). ONE exact path, nothing else: /origins/presence/health and /internal/where are deliberately NOT proxied (the health route can hand
# out tick samples and /internal/where is the writer's own loopback call). Presence listens on 127.0.0.1:8788 (PRESENCE_PORT); the token rides the Sec-WebSocket-Protocol header,
# never the URL, and nginx must not log that header. X-Real-IP is set here, overwriting anything a client sent: presence's per-IP caps read it (ipHeader is on behind nginx).
# NOT INSTALLED: there is no installer for it yet (Deploy owns that, like install-duel-relay.sh), and presence stays OFF (ORIGINS_PRESENCE unset).
location = /origins/presence {
    proxy_pass http://127.0.0.1:8788;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 90s;
    proxy_send_timeout 90s;
    proxy_buffering off;
    tcp_nodelay on;
}
