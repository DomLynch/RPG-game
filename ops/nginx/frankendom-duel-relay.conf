# Included ONLY inside the frankendom.com :443 server block (ops/install-duel-relay.sh), so the relay is reachable over TLS only
# (wss://frankendom.com/duel/relay): the :80 block redirects everything to https and is not touched. Three exact paths, nothing else.
# X-Real-IP is set here, overwriting anything a client sent: the relay's per-IP caps read it and it listens on 127.0.0.1 only.
# A socket goes to the shard its room names (the first character of ?token=, modulo the shard count); `if` holds only `set`.
location = /duel/relay {
    set $duel_relay_port 8787;   # shard 0, and any token that names no room (shard 0 refuses it)
    if ($arg_token ~ "^[bdfhjlnprtvxz13579]") { set $duel_relay_port 8797; }   # shard 1
    proxy_pass http://127.0.0.1:$duel_relay_port;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 90s;
    proxy_send_timeout 90s;
    proxy_buffering off;
    tcp_nodelay on;
}
location = /duel/relay/room {
    limit_except POST { deny all; }
    proxy_pass http://127.0.0.1:8787;
    proxy_set_header X-Real-IP $remote_addr;
    client_max_body_size 1k;
}
location = /duel/relay/health { proxy_pass http://127.0.0.1:8787; proxy_set_header X-Real-IP $remote_addr; }
