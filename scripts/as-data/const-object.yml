# as-data check (g): an UPPER_SNAKE top-level const OBJECT holding a number other than 0 or 1 (hard-coding audit 2026-10-17, gap 3: `CAPS = { attack: 1.15, res: 0.80 }`). Rule (d) (consts.yml) only fires on an object with a
# number of two digits or more, so single-digit decimals and small integers slipped past. This rule takes exactly what (d) does not (a const (d) already lists is not counted twice). A site is the const; check.ts holds the
# count to a ratchet (const-object-baseline.json, per file and const name): today's sites are a known backlog, a new one is red under --gate, a baseline above the tree is stale.
id: as-data-const-object
language: typescript
ignores:
  - '**/*.test.ts'
  - '**/fixtures.ts'
  - '**/*.d.ts'
rule:
  kind: variable_declarator
  all:
    - has: { field: name, kind: identifier, regex: "^[A-Z][A-Z0-9_]*$" }
    - has:
        field: value
        any: [{ kind: object }, { kind: as_expression }]
        has:
          kind: pair
          stopBy: end
          has:
            field: value
            any: [{ kind: number, not: { regex: "^[01]$" } }, { kind: unary_expression, regex: "^-\\s*[0-9]" }]
    # what (d) already lists: a two-digit number in an object, so it is counted once, there
    - not: { has: { field: value, any: [{ kind: object }, { kind: as_expression }], regex: "(?s):\\s*[0-9]{2,}|[*+]\\s*[0-9]{2,}" } }
    - inside: { kind: lexical_declaration, stopBy: neighbor, any: [{ inside: { kind: program, stopBy: neighbor } }, { inside: { kind: export_statement, stopBy: neighbor, inside: { kind: program, stopBy: neighbor } } }] }
