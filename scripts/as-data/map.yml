# as-data check (c): a label map keyed by content ids: an object-literal pair whose KEY is what is, by its spelling, a content id (__IDS__, filled in by the runner) and whose VALUE is a string.
# `{ fire: 'Fire', frost: 'Frost' }` is content (a display name, a colour, a blurb) kept in code; the string belongs in the id's data row. One site per pair, so the count is the number of labels still in code.
id: as-data-map
language: typescript
rule:
  kind: pair
  all:
    - has: { field: key, regex: "^['\"]?(__IDS__)['\"]?$" }
    - has: { field: value, kind: string }
  inside: { kind: object, stopBy: neighbor }
