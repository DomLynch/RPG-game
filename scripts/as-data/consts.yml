# as-data check (d): a tuning number kept as a named constant in code. In the files listed under `files` (each already moved to rows; add a file here when its
# numbers move) a top-level `const NAME = <number>` is content in TypeScript: the number belongs in a row of the file's rules table, read by name.
id: as-data-consts
language: typescript
files:
  - origins/feuds/feuds.ts
  - origins/patrons/patrons.ts
  - origins/preview/play.ts
  - origins/encounters/encounters.ts
  - origins/region1/shops.ts
rule:
  kind: variable_declarator
  all:
    - has: { field: name, kind: identifier, regex: "^[A-Z][A-Z0-9_]*$" }
    # WORLD_TUNING (origins/preview/play.ts) is the greybox's placement numbers, "to be swapped for origins/world": a world-row slice of its own, not this rule's.
    - not: { has: { field: name, kind: identifier, regex: "^WORLD_TUNING$" } }
    # a number, a negative number, or an object (optionally `as const`) holding a number of two digits or more
    - any:
        - has: { field: value, any: [{ kind: number }, { kind: unary_expression, regex: "^-?[0-9]" }, { any: [{ kind: object }, { kind: as_expression }], regex: "(?s):\\s*[0-9]{2,}|[*+]\\s*[0-9]{2,}" }] }
        # a tier or other word kept as a *_TIER constant (REGION1_LOOT_TIER)
        - all: [{ has: { field: name, regex: "_TIER$" } }, { has: { field: value, kind: string } }]
    - inside: { kind: lexical_declaration, stopBy: neighbor, any: [{ inside: { kind: program, stopBy: neighbor } }, { inside: { kind: export_statement, stopBy: neighbor, inside: { kind: program, stopBy: neighbor } } }] }
