<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="robots" content="noindex">
  <title>Origins — the walk out (greybox)</title>
  <style>
    /* Theme tokens: the one source of every colour, font, size, spacing and radius below. A look pass changes these, not the rules. */
    :root {
      --c-sand: #c9a47a; --c-ink: #f3e6d2; --c-ink-2: #d8c29c; --c-brass: #ad9365; --c-line: #5a4632; --c-panel: #241a12; --c-well: #1a120c;
      --c-btn: #3a2c1f; --c-glass: rgba(28, 20, 14, 0.82); --c-shade: rgba(0, 0, 0, 0.45); --c-ring: rgba(243, 230, 210, 0.45); --c-shadow: #000;
      --f-serif: Georgia, serif; --fs-xs: 11px; --fs-s: 12px; --fs-m: 14px; --fs-l: 15px; --fs-xl: 18px; --fs-x: 24px;
      --gap-xs: 6px; --gap-s: 10px; --gap-m: 16px; --gap-l: 22px; --r-s: 6px; --r-m: 10px; --r-pill: 24px;
      --tap: 44px; --tap-l: 48px; --panel-w: 360px; --stick: 96px;
    }
    html, body { margin: 0; height: 100%; background: var(--c-sand); overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; }
    canvas { display: block; width: 100vw; height: 100vh; height: 100dvh; }
    button { font-family: var(--f-serif); color: var(--c-ink); }
    [hidden] { display: none !important; }   /* #shade / #prompt set display, which would override the hidden attribute */
    .glass { border: 1px solid var(--c-brass); background: var(--c-glass); color: var(--c-ink); }
    #hud { position: fixed; left: 0; right: calc(var(--tap) * 2 + var(--gap-m)); top: env(safe-area-inset-top); padding: var(--gap-s) var(--gap-m); font: 600 var(--fs-m)/1.3 var(--f-serif); color: var(--c-ink); text-shadow: 0 1px 3px var(--c-shadow); pointer-events: none; }
    #hud small { display: block; font-weight: 400; opacity: 0.8; }
    #journal { position: fixed; top: calc(env(safe-area-inset-top) + var(--gap-s)); right: var(--gap-m); min-width: var(--tap); min-height: var(--tap); padding: 0 var(--gap-m); border-radius: var(--r-pill); font: 600 var(--fs-m) var(--f-serif); }
    #stick { position: fixed; width: var(--stick); height: var(--stick); margin: calc(var(--stick) / -2) 0 0 calc(var(--stick) / -2); border-radius: 50%; border: 2px solid var(--c-ring); display: none; pointer-events: none; }
    #prompt { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom)); transform: translateX(-50%); min-height: var(--tap-l); max-width: calc(100vw - 2 * var(--gap-m)); padding: 0 var(--gap-l); border-radius: var(--r-pill); font: 600 var(--fs-l) var(--f-serif); white-space: nowrap; }
    #shade { position: fixed; inset: 0; display: grid; place-items: center; padding: var(--gap-m); background: var(--c-shade); }
    #hint { position: fixed; left: var(--gap-m); right: var(--gap-m); top: 64px; padding: var(--gap-s) var(--gap-m); border-radius: var(--r-s); font: var(--fs-m)/1.4 var(--f-serif); text-align: center; pointer-events: none; }
    #panel { position: relative; width: min(100%, var(--panel-w)); max-height: calc(100dvh - 2 * var(--gap-m)); overflow-y: auto; box-sizing: border-box; padding: 18px var(--gap-m) var(--gap-m); border: 1px solid var(--c-brass); border-radius: var(--r-m); background: var(--c-panel); color: var(--c-ink); font: var(--fs-m)/1.4 var(--f-serif); }
    #panel h2 { margin: 0 var(--tap) var(--gap-s) 0; font-size: var(--fs-xl); } #panel h3 { margin: 12px 0 var(--gap-xs); font-size: var(--fs-m); color: var(--c-ink-2); }
    #panel .say { margin: var(--gap-s) 0 0; } #panel .muted { margin: var(--gap-s) 0 0; font-size: var(--fs-s); opacity: 0.7; }
    #shut { position: absolute; top: var(--gap-xs); right: var(--gap-xs); width: var(--tap); height: var(--tap); border: 0; background: none; font-size: var(--fs-x); }
    .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--gap-xs); }
    .slot { aspect-ratio: 1; padding: 2px; border: 1px solid var(--c-line); border-radius: var(--r-s); background: var(--c-well); font: var(--fs-xs)/1.15 var(--f-serif); overflow: hidden; }
    .piece { display: flex; width: 100%; justify-content: space-between; padding: var(--gap-s); margin-top: var(--gap-xs); border: 1px solid var(--c-line); border-radius: var(--r-s); background: none; font-size: var(--fs-m); }
    .slot.on, .piece.on { border-color: var(--c-brass); box-shadow: inset 0 0 0 1px var(--c-brass); }
    .act { display: block; width: 100%; min-height: var(--tap); margin-top: var(--gap-xs); border: 1px solid var(--c-line); border-radius: var(--r-s); background: var(--c-btn); font: 600 var(--fs-l) var(--f-serif); }
    .act:disabled { opacity: 0.5; }
  </style>
</head>
<body>
  <canvas id="view"></canvas>
  <div id="hud"><span id="place">The Pit</span><small>Greybox look prototype · drag (or WASD) to walk · not the game</small></div>
  <div id="hint" class="glass">Drag up to walk. Through the gate, the bank is straight ahead and the blacksmith on your left.</div>
  <div id="stick"></div>
  <button id="prompt" class="glass" hidden></button>
  <button id="journal" class="glass">Journal</button>
  <div id="shade" hidden><div id="panel" role="dialog"><button id="shut" aria-label="Close">×</button><div id="card"></div></div></div>
  <script type="module" src="./main.ts"></script>
</body>
</html>
