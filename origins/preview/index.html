<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="robots" content="noindex">
  <title>Origins — the walk out (greybox)</title>
  <style>
    html, body { margin: 0; height: 100%; background: #c9a47a; overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; }
    canvas { display: block; width: 100vw; height: 100vh; height: 100dvh; }
    #hud { position: fixed; left: 0; right: 0; top: env(safe-area-inset-top); padding: 10px 14px; font: 600 13px/1.3 Georgia, serif; color: #f3e6d2; text-shadow: 0 1px 3px #000; pointer-events: none; }
    #hud small { display: block; font-weight: 400; opacity: 0.8; }
    #bar { position: fixed; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom) + 14px); display: flex; justify-content: center; gap: 10px; }
    #bar button { font: 600 14px Georgia, serif; color: #f3e6d2; background: rgba(30, 22, 16, 0.72); border: 1px solid #8a6a44; border-radius: 6px; padding: 10px 16px; }
    #stick { position: fixed; width: 96px; height: 96px; margin: -48px 0 0 -48px; border-radius: 50%; border: 2px solid rgba(243, 230, 210, 0.45); display: none; pointer-events: none; }
  </style>
</head>
<body>
  <canvas id="view"></canvas>
  <div id="hud"><span id="place">The Pit</span><small>Greybox look prototype · drag to walk · not the game</small></div>
  <div id="stick"></div>
  <div id="bar"><button id="tour">Pause tour</button><button id="restart">Restart</button></div>
  <script type="module" src="./main.ts"></script>
</body>
</html>
