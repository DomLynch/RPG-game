<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="robots" content="noindex">
  <title>Origins — the walk out (greybox)</title>
  <style>
    html, body { margin: 0; height: 100%; background: #c9a47a; overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; }
    canvas { display: block; width: 100vw; height: 100vh; height: 100dvh; }
    #hud { position: fixed; left: 0; right: 0; top: env(safe-area-inset-top); padding: 10px 14px; font: 600 13px/1.3 Georgia, serif; color: #f3e6d2; text-shadow: 0 1px 3px #000; pointer-events: none; }
    #hud small { display: block; font-weight: 400; opacity: 0.8; }
    #stick { position: fixed; width: 96px; height: 96px; margin: -48px 0 0 -48px; border-radius: 50%; border: 2px solid rgba(243, 230, 210, 0.45); display: none; pointer-events: none; }
    #prompt { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom)); transform: translateX(-50%); min-height: 48px; max-width: calc(100vw - 32px); padding: 0 22px; border: 1px solid #ad9365; border-radius: 24px; background: rgba(28, 20, 14, 0.82); color: #f3e6d2; font: 600 15px Georgia, serif; white-space: nowrap; }
    #shade { position: fixed; inset: 0; display: grid; place-items: center; padding: 16px; background: rgba(0, 0, 0, 0.45); }
    [hidden] { display: none !important; }
    #hint { position: fixed; left: 16px; right: 16px; top: 64px; padding: 10px 14px; border: 1px solid #ad9365; border-radius: 8px; background: rgba(28, 20, 14, 0.82); color: #f3e6d2; font: 14px/1.4 Georgia, serif; text-align: center; pointer-events: none; }   /* #shade / #prompt set display, which would override the hidden attribute */
    #panel { position: relative; width: min(100%, 360px); box-sizing: border-box; padding: 18px 16px 16px; border: 1px solid #ad9365; border-radius: 10px; background: #241a12; color: #f3e6d2; font: 14px/1.4 Georgia, serif; }
    #panel h2 { margin: 0 44px 10px 0; font-size: 18px; } #panel h3 { margin: 12px 0 6px; font-size: 14px; color: #d8c29c; } #panel p { margin: 10px 0 0; font-size: 12px; opacity: 0.7; }
    #shut { position: absolute; top: 6px; right: 6px; width: 44px; height: 44px; border: 0; background: none; color: #f3e6d2; font: 24px Georgia, serif; }
    .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; } .grid i { aspect-ratio: 1; border: 1px solid #5a4632; border-radius: 6px; background: #1a120c; }
    .piece { display: flex; justify-content: space-between; padding: 10px; margin-top: 6px; border: 1px solid #5a4632; border-radius: 6px; }
    .act { width: 100%; min-height: 44px; margin-top: 12px; border: 1px solid #5a4632; border-radius: 6px; background: #3a2c1f; color: #f3e6d2; font: 600 15px Georgia, serif; opacity: 0.5; }
  </style>
</head>
<body>
  <canvas id="view"></canvas>
  <div id="hud"><span id="place">The Pit</span><small>Greybox look prototype · drag (or WASD) to walk · not the game</small></div>
  <div id="hint">Drag up to walk. Through the gate, the bank is straight ahead and the blacksmith on your left.</div>
  <div id="stick"></div>
  <button id="prompt" hidden></button>
  <div id="shade" hidden><div id="panel" role="dialog"><button id="shut" aria-label="Close">×</button><div id="card"></div></div></div>
  <script type="module" src="./main.ts"></script>
</body>
</html>
