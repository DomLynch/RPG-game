<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="robots" content="noindex">
  <title>Origins — the walk out (greybox)</title>
  <style>
    /* Theme tokens: the one source of every colour, font, size, spacing and radius below. A look pass changes these, not the rules. */
    :root {
      --c-sand: #c9a47a; --c-ink: #f3e6d2; --c-ink-2: #d8c29c; --c-brass: #ad9365; --c-line: #5a4632; --c-panel: #241a12; --c-well: #1a120c;
      --c-btn: #3a2c1f; --c-glass: rgba(28, 20, 14, 0.82); --c-shade: rgba(0, 0, 0, 0.45); --c-ring: rgba(243, 230, 210, 0.45); --c-shadow: #000;
      --f-serif: Georgia, serif; --fs-xs: 11px; --fs-s: 12px; --fs-m: 14px; --fs-l: 15px; --fs-xl: 18px; --fs-x: 24px;
      --gap-xs: 6px; --gap-s: 10px; --gap-m: 16px; --gap-l: 22px; --r-s: 6px; --r-m: 10px; --r-pill: 24px;
      --tap: 44px; --tap-l: 48px; --panel-w: 360px; --stick: 96px;
    }
    html, body { margin: 0; height: 100%; background: var(--c-sand); overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; }
    canvas { display: block; width: 100vw; height: 100vh; height: 100dvh; }
    button { font-family: var(--f-serif); color: var(--c-ink); }
    [hidden] { display: none !important; }   /* #shade / #prompt set display, which would override the hidden attribute */
    .glass { border: 1px solid var(--c-brass); background: var(--c-glass); color: var(--c-ink); }
    #hud { position: fixed; z-index: 1; left: 0; right: calc(var(--tap) * 2 + var(--gap-m)); top: env(safe-area-inset-top); padding: var(--gap-s) var(--gap-m); font: 600 var(--fs-m)/1.3 var(--f-serif); color: var(--c-ink); text-shadow: 0 1px 3px var(--c-shadow); pointer-events: none; }
    #hud small { display: block; font-weight: 400; opacity: 0.8; }
    body:has(#duel:not([hidden])) #hud .walk-only { display: none; }   /* the walk help would wrap into the duel meters at 375 */
    #walk-journal { position: fixed; top: calc(env(safe-area-inset-top) + var(--gap-s)); right: var(--gap-m); min-width: var(--tap); min-height: var(--tap); padding: 0 var(--gap-m); border-radius: var(--r-pill); font: 600 var(--fs-m) var(--f-serif); }
    #allegiance { position: fixed; top: calc(env(safe-area-inset-top) + var(--gap-s) + var(--tap) + var(--gap-xs)); right: var(--gap-m); min-width: var(--tap); min-height: var(--tap); padding: 0 var(--gap-m); border-radius: var(--r-pill); font: 600 var(--fs-m) var(--f-serif); }
    .stick { position: fixed; bottom: calc(env(safe-area-inset-bottom) + 28px + var(--stick) / 2); margin-bottom: 0; width: var(--stick); height: var(--stick); margin: calc(var(--stick) / -2) 0 0 calc(var(--stick) / -2); border-radius: 50%; border: 2px solid var(--c-ring); pointer-events: none; opacity: 0; transition: opacity 0.15s; }
        #move-stick { left: calc(24px + var(--stick) / 2); } #look-stick { left: calc(100% - 24px - var(--stick) / 2); }
    .stick.on { opacity: 1; bottom: auto; }
    .stick i { position: absolute; left: 50%; top: 50%; width: 38%; height: 38%; margin: -19% 0 0 -19%; border-radius: 50%; background: var(--c-ring); }
    @media (pointer: coarse), (max-width: 900px) { .stick { opacity: 0.55; } .stick.on { opacity: 1; } }
    #prompt { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom)); transform: translateX(-50%); min-height: var(--tap-l); max-width: calc(100vw - 2 * var(--gap-m)); padding: 0 var(--gap-l); border-radius: var(--r-pill); font: 600 var(--fs-l) var(--f-serif); white-space: nowrap; }
    #shade { position: fixed; inset: 0; display: grid; place-items: center; padding: var(--gap-m); background: var(--c-shade); }
    #creature-card { margin-top: var(--gap-s); padding: var(--gap-xs) var(--gap-m); border-radius: var(--r-s); font: var(--fs-m)/1.4 var(--f-serif); text-shadow: none; pointer-events: none; }   /* in the HUD's flow, under the hint; an overlay, never a pause */
    #hint { margin-top: var(--gap-s); padding: var(--gap-s) var(--gap-m); border-radius: var(--r-s); font: var(--fs-m)/1.4 var(--f-serif); text-align: center; text-shadow: none; pointer-events: none; }   /* in the HUD's flow: always under the status lines, however many they wrap to */
    #panel { position: relative; width: min(100%, var(--panel-w)); max-height: calc(100dvh - 2 * var(--gap-m)); overflow-y: auto; box-sizing: border-box; padding: 18px var(--gap-m) var(--gap-m); border: 1px solid var(--c-brass); border-radius: var(--r-m); background: var(--c-panel); color: var(--c-ink); font: var(--fs-m)/1.4 var(--f-serif); }
    #panel h2 { margin: 0 var(--tap) var(--gap-s) 0; font-size: var(--fs-xl); } #panel h3 { margin: 12px 0 var(--gap-xs); font-size: var(--fs-m); color: var(--c-ink-2); }
    #panel .say { margin: var(--gap-s) 0 0; } #panel .muted { margin: var(--gap-s) 0 0; font-size: var(--fs-s); opacity: 0.7; }
    #shut { position: absolute; top: var(--gap-xs); right: var(--gap-xs); width: var(--tap); height: var(--tap); border: 0; background: none; font-size: var(--fs-x); }
    .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--gap-xs); }
    .slot { aspect-ratio: 1; padding: 2px; border: 1px solid var(--c-line); border-radius: var(--r-s); background: var(--c-well); font: var(--fs-xs)/1.15 var(--f-serif); overflow: hidden; }
    .piece { display: flex; width: 100%; justify-content: space-between; padding: var(--gap-s); margin-top: var(--gap-xs); border: 1px solid var(--c-line); border-radius: var(--r-s); background: none; font-size: var(--fs-m); }
    .slot.on, .piece.on { border-color: var(--c-brass); box-shadow: inset 0 0 0 1px var(--c-brass); }
    .act { display: block; width: 100%; min-height: var(--tap); margin-top: var(--gap-xs); border: 1px solid var(--c-line); border-radius: var(--r-s); background: var(--c-btn); font: 600 var(--fs-l) var(--f-serif); }
    .act:disabled { opacity: 0.5; }
    /* The Pit duel: a layer over the walk. Its fight kit is the game's own (src/style.css, switched on with the duel); only the preview's pieces are styled here. */
    .layer { position: fixed; inset: 0; z-index: 3; background: var(--c-shadow); }   /* over the walk's own HUD */
    /* Leave the Pit: clear of the game's kit — above the stick on a phone (the bars and ☰ own the top), under the ☰ on a desktop. */
    #leave { position: fixed; z-index: 2; left: max(16px, env(safe-area-inset-left)); bottom: calc(max(30px, env(safe-area-inset-bottom)) + 136px); min-height: var(--tap); padding: 0 var(--gap-m); border-radius: var(--r-pill); font: 600 var(--fs-m) var(--f-serif); }
    @media (min-width: 901px) and (not (pointer: coarse)) { #leave { left: auto; bottom: auto; right: max(32px, env(safe-area-inset-right)); top: calc(max(28px, env(safe-area-inset-top)) + 64px); } }
    /* The game's menu in a preview: the career, the account and the fighter's gear are the game's, not this page's, so the menu keeps
       Settings (Sound, How to fight) and the app nav's Arena and The Pit (= Leave the Pit). The camera is the game's locked one, always:
       its lock and recenter controls are not offered. */
    #duel .fighter, #duel #account, #duel .tab-profile, #duel .tab-fighter, #duel .tab-arena, #duel .pane-profile, #duel .pane-fighter, #duel .pane-arena, #duel #test-tools,
    #duel #nav-gear, #duel #nav-note, #duel #mobile-camera, #duel #camera-button, #duel #recenter-button { display: none !important; }
    /* World mode (?region=1): the Pit's own kit is the walk's controls. The layer lets the walk's canvas through; only the stick, the buttons and the ☰ take a touch. */
    #duel.world { background: none; pointer-events: none; }
    #duel.world #joystick, #duel.world #actions, #duel.world header { pointer-events: auto; }
    #duel.world #opponent-name, #duel.world #target-health, #duel.world #target-posture, #duel.world #combat-status, #duel.world #leave, #duel.world #art-status, #duel.world #dmg-pool, #duel.world #debug, #duel.world #reset-button, #duel.world #run-button { display: none !important; }
    #duel.world .combat-hud { top: max(calc(env(safe-area-inset-top) + 92px), calc(var(--hud-bottom, 0px) + var(--gap-xs))); }   /* the player's health and stamina bars: under the place name, and under the hint / creature card when they stack taller (--hud-bottom, main.ts) */
    #duel.world #mobile-camera { display: revert !important; }
    body.kit #move-stick, body.kit #look-stick { display: none; }
    body.kit #walk-journal, body.kit #allegiance { display: none; }   /* the main screen is the combat HUD and the ☰ only: Journal is a button in the ☰'s Settings */
  </style>
</head>
<body>
  <canvas id="view"></canvas>
  <div id="hud"><span id="place">The Pit</span><small id="career"></small><small id="save"></small><small class="walk-only">Greybox preview · not the game</small>
    <div id="hint" class="glass">Left thumb walks (push to the edge to run), right thumb looks around. Through the gate, the bank is straight ahead and the blacksmith on your left.</div>
    <div id="creature-card" class="glass" hidden></div></div>
  <div id="move-stick" class="stick"><i></i></div><div id="look-stick" class="stick"><i></i></div>
  <button id="prompt" class="glass" hidden></button>
  <button id="walk-journal" class="glass">Journal</button>
  <button id="allegiance" class="glass" hidden>Allegiance</button>
  <div id="shade" hidden><div id="panel" role="dialog"><button id="shut" aria-label="Close">×</button><div id="card"></div></div></div>
  <!-- The Pit duel (pit-duel.ts, its own chunk): the live game's own fight kit — its controls, HUD bars and ☰ menu — is cut from the game's
       index.html at build time (live-kit.mjs) and lands at the marker; src/style.css comes with the duel's chunk and is on only while it is
       up. Its canvas (#world) is added on the first fight. Leave the Pit is the preview's own. -->
  <section id="duel" class="layer" aria-label="The Pit duel" hidden>
    <!-- live:fight-kit -->
    <button id="leave" class="glass">Leave the Pit</button>
  </section>
  <script type="module" src="./main.ts"></script>
</body>
</html>
