<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Frankendom character preview</title>
<style>
  html,body{margin:0;height:100%;background:#2b2d2f;color:#ddd;font:12px system-ui;overflow:hidden}
  #bar{position:fixed;top:0;left:0;right:0;display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:6px;background:#1c1d1ecc;z-index:1}
  #bar select,#bar button,#bar input{font:inherit}
  #world{display:block;margin:auto}
  #sheet{display:none}
</style>
</head>
<body>
<div id="bar">
  <button data-mode="studio">Studio turntable</button><button data-mode="clip">Clip scrub</button>
  <button data-mode="landscape">Lock 844×390</button><button data-mode="portrait">Lock 390×844</button>
  <select id="clip"></select><input id="scrub" type="range" min="0" max="1" step="0.001" value="0"><span id="time"></span>
  <span id="status">Loading…</span>
</div>
<canvas id="world"></canvas>
<canvas id="sheet"></canvas>
<script type="module">
// Review harness only: never built into the game (no vite.config → index.html is the sole build input).
// Everything here is either the game's own code (loader, camera, timings) or a FROZEN inspection rig.
// Changing lighting or cameras here to flatter an asset is a failed iteration.
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { clone } from 'three/addons/utils/SkeletonUtils.js';
import { loadWarriors, CLIPS, COMBAT_CLIPS } from '/src/characters.ts';
import { cameraPose } from '/src/scene.ts';
import { ATTACKS, MOVES, RULES, SWORD } from '/src/combat.ts'; // DEFENCE/KICK views were dropped by the combat lane; the same numbers live in RULES/MOVES
const KICK = { contact: MOVES.kick.windup, recovery: MOVES.kick.windup + MOVES.kick.active + MOVES.kick.recovery }, DEFENCE = { roll: RULES.roll };
import { TARGET, wrapAngle } from '/src/sim.ts';

const PARAMS = new URLSearchParams(location.search);
const GLB = new URL('/src/assets/warrior.glb', location.href).href, ENEMY = new URL(PARAMS.get('enemy') || '/src/assets/veteran.glb', location.href).href; // the game's pairing: player, Veteran opponent (?enemy=<glb> reviews another opponent build, e.g. the weapons lane's)
const TICK = 1 / 60, GAME_RATIO = 1.5, LOCK = { portrait: [390, 844], landscape: [844, 390], phone: [393, 852], phoneLandscape: [852, 393] };
const canvas = document.getElementById('world'), sheet = document.getElementById('sheet'), ctx = sheet.getContext('2d');
const status = text => document.getElementById('status').textContent = text;

// Game renderer settings (src/scene.ts createScene).
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFShadowMap; renderer.toneMapping = THREE.ACESFilmicToneMapping;
const pmrem = new THREE.PMREMGenerator(renderer), room = new RoomEnvironment(), environment = pmrem.fromScene(room, 0.04).texture; room.dispose(); pmrem.dispose();
function mesh(scene, geometry, material, x, y, z) { const m = new THREE.Mesh(geometry, material); m.position.set(x, y, z); m.castShadow = m.receiveShadow = true; scene.add(m); return m; }
// Arena: the game's lights, fog, environment and floor. No colonnade — this reviews the character, not the set.
const arena = new THREE.Scene(); arena.background = new THREE.Color('#9ca8a6'); arena.fog = new THREE.FogExp2('#9ca8a6', 0.018);
arena.environment = environment; arena.environmentIntensity = 0.65;
arena.add(new THREE.HemisphereLight('#d2e0e4', '#575c4c', 2.5));
const sun = new THREE.DirectionalLight('#ffdfad', 3.6); sun.position.set(-15, 26, -18); sun.castShadow = true; sun.shadow.mapSize.set(1024, 1024);
Object.assign(sun.shadow.camera, { left: -15, right: 15, top: 15, bottom: -15, near: 1, far: 70 }); sun.shadow.normalBias = 0.04; arena.add(sun);
const arenaFloor = [
  mesh(arena, new THREE.CylinderGeometry(9.5, 10, 0.5, 80), new THREE.MeshStandardMaterial({ color: '#555b56', roughness: 1 }), 0, -0.28, 0),
  mesh(arena, new THREE.CylinderGeometry(9, 9, 0.1, 80), new THREE.MeshStandardMaterial({ color: '#878579', roughness: 0.98 }), 0, -0.03, 0),
  mesh(arena, new THREE.CylinderGeometry(65, 65, 1, 64), new THREE.MeshStandardMaterial({ color: '#555e50', roughness: 1 }), 0, -1.1, 0),
];
// Studio: neutral inspection lighting, frozen at baseline.
const studio = new THREE.Scene(); studio.background = new THREE.Color('#4a4d50'); studio.environment = environment; studio.environmentIntensity = 1;
studio.add(new THREE.HemisphereLight('#cfd4d8', '#3a3a3a', 1));
const key = new THREE.DirectionalLight('#ffffff', 2.4); key.position.set(3, 7, 5); key.castShadow = true; key.shadow.mapSize.set(2048, 2048);
Object.assign(key.shadow.camera, { left: -3, right: 3, top: 3, bottom: -3, near: 1, far: 20 }); key.shadow.normalBias = 0.02; studio.add(key);
const rim = new THREE.DirectionalLight('#dfe8ff', 1.2); rim.position.set(-4, 5, -4); studio.add(rim);
const studioFloor = mesh(studio, new THREE.CircleGeometry(3, 64), new THREE.MeshStandardMaterial({ color: '#6b6b6b', roughness: 0.9 }), 0, 0, 0);
studioFloor.rotation.x = -Math.PI / 2; studioFloor.castShadow = false;
const grid = new THREE.GridHelper(4, 8, '#3c3c3c', '#3c3c3c'); grid.position.y = 0.002; studio.add(grid);
const camera = new THREE.PerspectiveCamera(51, 1, 0.1, 180);

// Fighters: the game's loader and update() contract. Phases mirror src/scene.ts render() → update() mapping.
const player = new THREE.Group(), opponent = new THREE.Group();
let warriors, clips = [], enemyClips = [], enemyAsset, scrubbers = new Map(), swaps = new Map(); // enemyClips: the opponent's own clip list (a weapon build carries clips the player's rig does not)
const phaseOf = name => {
  const [kind, attack = 'light'] = name.split(':');
  if (kind === 'attack') return { pose: 'attack', attack, duration: ATTACKS[attack].recovery, contact: ATTACKS[attack].contact / ATTACKS[attack].recovery };
  return { walk: { pose: 'sheathed', forward: 1.7 }, armedwalk: { pose: 'ready', forward: 1.7 }, strafeleft: { pose: 'ready', side: -1 }, straferight: { pose: 'ready', side: 1 },
    ready: { pose: 'ready' }, guard: { pose: 'guard' }, draw: { pose: 'draw', duration: SWORD.draw }, roll: { pose: 'roll', duration: DEFENCE.roll },
    kick: { pose: 'kick', duration: KICK.recovery, contact: KICK.contact / KICK.recovery }, hit: { pose: 'hit', attack, duration: SWORD.reaction },
    death: { pose: 'death', attack, duration: SWORD.death }, block: { pose: 'block', duration: 12, recoil: true }, parry: { pose: 'parry', duration: 18 }, deflected: { pose: 'deflected', duration: 36 } }[kind];
};
function fighter(group, x, z) { return { group, x, z, heading: 0, shown: 0, phase: 'ready', age: 0, name: 'ready', started: false }; }
let P, O, cam = { yaw: 0, started: false, desired: new THREE.Vector3(), aim: new THREE.Vector3() };
function set(f, name) { if (name !== f.name) { f.name = name; f.phase = phaseOf(name); f.age = 0; f.aimHeading = f.heading; } }
function step(f, rig, other) {
  const p = f.phase, dt = TICK, x0 = f.x, z0 = f.z;
  f.heading = p.pose === 'attack' ? f.aimHeading : Math.atan2(other.x - f.x, other.z - f.z);
  if (p.forward) { f.x += Math.sin(f.heading) * p.forward * dt; f.z += Math.cos(f.heading) * p.forward * dt; }
  if (p.side) { f.x += Math.cos(f.heading) * .75 * p.side * dt; f.z -= Math.sin(f.heading) * .75 * p.side * dt; }
  const dx = f.x - x0, dz = f.z - z0, travel = Math.hypot(dx, dz) / dt;
  const progress = p.duration ? Math.min(1, f.age / p.duration) : 0, attack = p.attack || 'light';
  rig.update(dx * Math.sin(f.heading) + dz * Math.cos(f.heading) < -.0001 ? -travel : travel, dt, p.pose, progress, attack, p.contact ?? .35,
    travel ? (dx * Math.cos(f.heading) - dz * Math.sin(f.heading)) / (travel * dt) : 0, p.recoil ? Math.max(0, 1 - f.age / 12) : 0);
  const blend = 1 - Math.exp(-dt * 8);
  f.shown = f.started ? f.shown + wrapAngle(f.heading - f.shown) * blend : f.heading;
  if (['kick', 'attack', 'roll', 'guard', 'hit', 'death'].includes(p.pose)) f.shown = f.heading;
  f.group.position.set(f.x, 0, f.z); f.group.rotation.y = f.shown; f.started = true; f.age++;
}
function tick(playerPhase, opponentPhase) {
  set(P, playerPhase); set(O, opponentPhase);
  step(P, warriors.player, O); step(O, warriors.opponent, P);
  const dt = TICK, blend = 1 - Math.exp(-dt * 8), lockYaw = Math.atan2(P.x - O.x, P.z - O.z);
  cam.yaw = cam.started ? cam.yaw + wrapAngle(lockYaw - cam.yaw) * blend : lockYaw;
  const pose = cameraPose(P, cam.yaw, 0.45, true, O);
  const desired = new THREE.Vector3(pose.x, pose.y, pose.z), look = new THREE.Vector3(pose.lookX, 1, pose.lookZ);
  cam.desired.lerp(desired, cam.started ? blend : 1); cam.aim.lerp(look, cam.started ? blend : 1); cam.started = true;
}
// The review sequence: [ticks, player phase, opponent phase]. Phase durations are the game's own; a phase only restarts when its name changes.
const SEQUENCE = [
  [30, 'armedwalk', 'ready'], [24, 'strafeleft', 'ready'],
  [14, 'attack:light', 'guard'], [12, 'attack:light', 'block'], [14, 'attack:light', 'guard'],
  [32, 'attack:heavy', 'guard'], [24, 'attack:heavy', 'hit:heavy'], [12, 'attack:heavy', 'ready'],
  [4, 'guard', 'ready'], [14, 'guard', 'attack:light'], [12, 'block', 'attack:light'], [14, 'guard', 'attack:light'],
  [12, 'guard', 'attack:return'], [18, 'parry', 'deflected'], [12, 'attack:riposte', 'deflected'], [6, 'attack:riposte', 'deflected'],
  [18, 'attack:riposte', 'hit:riposte'], [6, 'ready', 'hit:riposte'], [14, 'ready', 'attack:light'], [26, 'death:light', 'attack:light'], [42, 'death:light', 'ready'],
];
const SEQUENCE_TICKS = SEQUENCE.reduce((n, [t]) => n + t, 0);
function* sequence() { for (const [ticks, p, o] of SEQUENCE) for (let i = 0; i < ticks; i++) yield [p, o]; }

// ?src=<url> inspects any glTF/GLB (a raw source, a single part) in the same rigs; update() is a no-op for it.
const SRC = PARAMS.get('src');
async function inspectable(url) {
  const asset = await new GLTFLoader().loadAsync(url), make = () => { const anchor = new THREE.Group(), root = clone(asset.scene); root.traverse(o => { if (o.isMesh) { o.castShadow = o.receiveShadow = true; o.frustumCulled = false; } }); anchor.add(root); return { anchor, update() {} }; };
  clips = asset.animations; return { player: make(), opponent: make() };
}
async function reset() {
  warriors = SRC ? await inspectable(SRC) : await loadWarriors(GLB, ENEMY); scrubbers.clear();
  enemyClips = SRC ? clips : (enemyAsset ??= await new GLTFLoader().loadAsync(ENEMY)).animations;
  for (const [name, mode] of swaps) api.swapMaterial(name, mode); // diagnostic overrides survive the reload
  player.clear(); opponent.clear(); player.add(warriors.player.anchor); opponent.add(warriors.opponent.anchor);
  P = fighter(player, 0, TARGET.z + SWORD.reach + .85); O = fighter(opponent, TARGET.x, TARGET.z);
  cam = { yaw: 0, started: false, desired: new THREE.Vector3(), aim: new THREE.Vector3() };
}
// Scrub any clip on either rig with a harness-owned mixer; the game's own mixer is untouched and never updated afterwards.
function scrub(group, name, t) {
  const root = group.children[0], list = group === opponent ? enemyClips : clips; if (!list.some(c => c.name === name)) return; // inspected sources may carry no clips
  if (!scrubbers.has(root)) { const mixer = new THREE.AnimationMixer(root); scrubbers.set(root, { mixer, actions: new Map(list.map(c => [c.name, mixer.clipAction(c)])) }); }
  const { mixer, actions } = scrubbers.get(root);
  for (const [n, a] of actions) if (n !== name) a.stop();
  const action = actions.get(name); action.play(); action.paused = true; action.time = Math.min(t, .999999) * action.getClip().duration; mixer.update(0);
  const armed = !CLIPS.includes(name) && !(name === 'Draw' && t < .29);
  const drawn = root.getObjectByName('SwordDrawn'), sheathed = root.getObjectByName('SwordSheathed'), weapon = root.getObjectByName('WeaponDrawn'); // absent on raw sources
  if (drawn) drawn.visible = armed; if (sheathed) sheathed.visible = !armed; if (weapon) weapon.visible = true; // a fighter who starts armed never stows his weapon
}
// The weapon a rig carries: the weapons lane's WeaponDrawn (extras.contact = the striking segment in metres along local Y) or the longsword.
function weaponOf(group) { const root = group.children[0], node = root.getObjectByName('WeaponDrawn') || root.getObjectByName('SwordDrawn'); const c = node?.userData?.contact; return node ? { node, contact: c ? [c.from, c.to] : [.18, .86] } : null; }
function stage(scene) { scene.add(player, opponent); }
function frame(w, h, ratio) { renderer.setPixelRatio(ratio); renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); }
function lockCamera() { camera.fov = 51; camera.position.copy(cam.desired); camera.lookAt(cam.aim); }
function studioCamera(pair, azimuth = 0) {
  camera.fov = 35; const d = pair ? 6.2 : 4.8;
  camera.position.set(Math.sin(azimuth) * d, 1.05, Math.cos(azimuth) * d); camera.lookAt(0, 0.95, 0);
}
// Sheets: cells are copied from the WebGL buffer at physical size, captioned, and returned as a PNG data URL.
function cells(cols, rows, w, h, ratio, draw, zoom = 1) {
  // zoom > 1: render at ratio×zoom and copy a 1:1 crop around the fighters' projected midpoint — same camera, more pixels on the character.
  const W = w * ratio, H = h * ratio, B = ratio * zoom;
  sheet.width = cols * W; sheet.height = rows * H; ctx.fillStyle = '#111'; ctx.fillRect(0, 0, sheet.width, sheet.height);
  frame(w, h, B);
  for (let i = 0; i < cols * rows; i++) {
    const caption = draw(i); if (caption === false) break;
    const x = (i % cols) * W, y = Math.floor(i / cols) * H;
    if (zoom > 1) {
      const mid = new THREE.Vector3((P.x + O.x) / 2, 1, (P.z + O.z) / 2).project(camera);
      const sx = Math.min(w * B - W, Math.max(0, (mid.x + 1) / 2 * w * B - W / 2)), sy = Math.min(h * B - H, Math.max(0, (1 - mid.y) / 2 * h * B - H / 2));
      ctx.drawImage(canvas, sx, sy, W, H, x, y, W, H);
    } else ctx.drawImage(canvas, x, y);
    ctx.fillStyle = '#000a'; ctx.fillRect(x, y, W, 18); ctx.fillStyle = '#eee'; ctx.font = '12px system-ui'; ctx.fillText(caption + (zoom > 1 ? `  crop ×${zoom}` : ''), x + 4, y + 13);
  }
  return sheet.toDataURL('image/png');
}
function settle(ticks, p = 'ready', o = 'ready') { for (let i = 0; i < ticks; i++) tick(p, o); }

const CLIP_SHEET = [['Idle', .35], ['Walk', .35], ['Jog', .35], ['Run', .35], ['Armed', .35], ['ArmedWalk', .35], ['StrafeLeft', .35], ['StrafeRight', .35],
  ['Draw', .6], ['Attack', 14 / 40], ['Return', 12 / 34], ['Heavy', .2], ['Heavy', 32 / 68], ['Riposte', 12 / 36], ['Kick', 18 / 44], ['Roll', .3],
  ['Roll', .7], ['Guard', .5], ['BlockImpact', .5], ['Parry', .5], ['Deflected', .5], ['Hit', .35], ['Death', .5], ['Death', .95]];

// Close-ups for the audit and for every before/after: [caption, clip, t, node, distance, azimuth, elevation]. Studio rig, fov 30.
const DETAILS = [
  ['head front', 'Armed', 0, 'Head', .9, .25, .1], ['eyes', 'Armed', 0, 'Head', .42, .15, .02], ['head 3/4', 'Armed', 0, 'Head', .9, 1.1, .15], ['neck / back of helm', 'Armed', 0, 'neck_01', .9, 2.9, .3],
  ['shoulder armed', 'Armed', 0, 'upperarm_r', 1.1, .9, .35], ['armpit heavy wind-up', 'Heavy', .2, 'upperarm_r', 1.1, -.7, .3], ['shoulders guard', 'Guard', .5, 'spine_03', 1.4, .5, .25],
  ['grip armed', 'Armed', 0, 'hand_r', .9, -1.4, .35], ['grip attack contact', 'Attack', 14 / 40, 'hand_r', .8, .8, .3], ['sword', 'Armed', 0, 'SwordDrawn', 1.6, .6, .2],
  ['feet strafe', 'StrafeLeft', .35, 'foot_l', 1.1, .6, .45], ['feet armed', 'Armed', 0, 'foot_r', 1.5, .4, .55], ['hips / scabbard', 'Armed', 0, 'pelvis', 1.3, 2.6, .2],
];
const api = {
  loaded: false, error: null, SEQUENCE, ticks: SEQUENCE_TICKS,
  reset,
  // Weapons lane views (node scripts/character-preview.mjs --weapons [--enemy <glb>]): the opponent's weapon alone, in his hands, its
  // clips, the brief's phone lock camera and one scripted exchange — the same captures for the longsword baseline and every weapon after it.
  weaponRoles() { // role → the opponent's clip: a weapon build carries its own set (Trident_*); the baseline Veteran uses the sword's
    const trident = enemyClips.some(c => c.name === 'Trident_Idle');
    return trident ? { idle: 'Trident_Idle', approach: 'Trident_Walk', strafeLeft: 'Trident_StrafeLeft', strafeRight: 'Trident_StrafeRight', thrust: 'Trident_Thrust', chain: 'Trident_ThrustChain', sweep: 'Trident_Sweep', high: 'Trident_High', guard: 'Trident_Guard', impact: 'Trident_BlockImpact', deflected: 'Trident_Deflected', hit: 'Trident_Hit', death: 'Trident_Death' }
      : { idle: 'Armed', approach: 'ArmedWalk', strafeLeft: 'StrafeLeft', strafeRight: 'StrafeRight', thrust: 'Riposte', chain: 'Riposte', sweep: 'Attack', high: 'Heavy', guard: 'Guard', impact: 'BlockImpact', deflected: 'Deflected', hit: 'Hit', death: 'Death' };
  },
  async weaponTurntable() { // the weapon alone, upright at the origin, eight azimuths (rig units: the fighter's .9/.97 scale is not applied)
    await reset(); stage(studio); player.visible = opponent.visible = false; renderer.toneMappingExposure = 1;
    const w = weaponOf(opponent); if (!w) throw new Error('the opponent carries no weapon node');
    const solo = w.node.clone(true); solo.position.set(0, 0, 0); solo.quaternion.identity(); solo.scale.set(1, 1, 1); solo.traverse(o => { o.visible = true; });
    const holder = new THREE.Group(); holder.add(solo); studio.add(holder); holder.updateWorldMatrix(true, true);
    const box = new THREE.Box3().setFromObject(solo), size = box.getSize(new THREE.Vector3()), mid = box.getCenter(new THREE.Vector3());
    holder.position.set(-mid.x, 1 - mid.y, -mid.z); const d = Math.max(size.x, size.y, size.z) * 1.35;
    const out = cells(4, 2, 480, 720, 1, i => { const a = i * Math.PI / 4; camera.fov = 35; camera.position.set(Math.sin(a) * d, 1.05, Math.cos(a) * d); camera.lookAt(0, 1, 0); renderer.render(studio, camera); return `${w.node.name} ${i * 45}°  ${size.y.toFixed(2)} m, contact ${w.contact[0]}–${w.contact[1]} m`; });
    studio.remove(holder); player.visible = opponent.visible = true; return out;
  },
  async weaponOnRig() { // attachment and grip in idle, walk, strafes and guard; the contact pose of every attack
    const r = this.weaponRoles(), node = weaponOf(opponent)?.node.name || 'SwordDrawn';
    return this.details([
      ['weapon in hand', r.idle, 0, node, 1.7, .6, .2], ['head', r.idle, 0, node, 1.0, .6, .25], ['rear grip', r.idle, 0, 'hand_r', .8, .9, .3], ['front grip', r.idle, 0, 'hand_l', .8, -.7, .45],
      ['walk', r.approach, .35, 'spine_03', 2.2, .7, .2], ['strafe left', r.strafeLeft, .35, 'spine_03', 2.2, .7, .2], ['strafe right', r.strafeRight, .35, 'spine_03', 2.2, .7, .2], ['guard', r.guard, 1, 'spine_03', 2.0, .5, .25],
      ['thrust contact', r.thrust, .34, 'spine_03', 2.6, 1.2, .2], ['chain contact', r.chain, .34, 'spine_03', 2.6, 1.2, .2], ['sweep contact', r.sweep, .34, 'spine_03', 2.6, .8, .35], ['high contact', r.high, .48, 'spine_03', 2.6, .8, .2],
    ], 'opponent');
  },
  async weaponClips() { // the opponent's clip set at its key fractions (contact keys .34 / .48 as the sword's)
    const r = this.weaponRoles(), list = [[r.idle, 0], [r.idle, .5], [r.approach, .25], [r.approach, .75], [r.strafeLeft, .35], [r.strafeRight, .35], [r.guard, .5], [r.guard, 1],
      [r.thrust, .18], [r.thrust, .34], [r.thrust, .55], [r.chain, .34], [r.sweep, .15], [r.sweep, .34], [r.sweep, .5], [r.high, .28], [r.high, .48], [r.high, .64],
      [r.impact, .35], [r.deflected, .35], [r.hit, .35], [r.death, .5], [r.death, .95]];
    await reset(); stage(studio); player.visible = false; opponent.visible = true; renderer.toneMappingExposure = 1; opponent.position.set(0, 0, 0); opponent.rotation.y = 0;
    const out = cells(8, Math.ceil(list.length / 8), 360, 480, 1, i => { if (!list[i]) return false; const [name, t] = list[i]; scrub(opponent, name, t); studioCamera(false, Math.PI / 6); renderer.render(studio, camera); return `${name} t=${t}`; });
    player.visible = true; return out;
  },
  async weaponLock(orientation = 'phone', role = 'idle', t = 0) { // the game's lock camera at the brief's phone sizes, the opponent posed by his own clip
    await reset(); stage(arena); opponent.visible = player.visible = true; renderer.toneMappingExposure = 1.3; settle(30);
    const [w, h] = LOCK[orientation], name = this.weaponRoles()[role];
    return cells(1, 1, w, h, GAME_RATIO, () => { scrub(opponent, name, t); lockCamera(); renderer.render(arena, camera); return `lock ${w}×${h} @${GAME_RATIO}  ${name} t=${t}`; });
  },
  async weaponExchange(orientation = 'phoneLandscape', every = 15, zoom = 1) { // 6 s (360 ticks): approach, thrust, chain, sweep, high, guard, block impact, deflected, hit, death; the player is the game's rig, the opponent his own clips
    const r = this.weaponRoles(), ROLES = [['approach', 40, 'armedwalk', 'ready'], ['thrust', 42, 'ready', 'guard'], ['chain', 34, 'ready', 'guard'], ['sweep', 50, 'ready', 'guard'], ['high', 68, 'ready', 'guard'],
      ['guard', 30, 'guard', 'attack:light'], ['impact', 24, 'block', 'attack:light'], ['deflected', 36, 'deflected', 'attack:riposte'], ['hit', 20, 'hit', 'attack:light'], ['death', 16, 'death', 'attack:light']];
    await reset(); stage(arena); opponent.visible = player.visible = true; renderer.toneMappingExposure = 1.3;
    const [w, h] = LOCK[orientation], total = ROLES.reduce((n, x) => n + x[1], 0), frames = Math.ceil(total / every), cols = 6;
    const run = (function* () { for (const [role, ticks, oppPhase, playerPhase] of ROLES) for (let i = 0; i < ticks; i++) yield [role, i / ticks, oppPhase, playerPhase]; })();
    let n = 0, current = run.next();
    const pose = ([role, progress, oppPhase, playerPhase]) => { tick(playerPhase, oppPhase); const name = r[role], clip = enemyClips.find(c => c.name === name); scrub(opponent, name, role === 'approach' && clip ? (n * TICK / clip.duration) % 1 : progress); };

  async weaponStats() { // the weapon node's own cost and the opponent's clip list
    await reset(); const w = weaponOf(opponent); if (!w) return null;
    let triangles = 0; const materials = new Set(); w.node.traverse(o => { if (o.isMesh) { const g = o.geometry; triangles += (g.index ? g.index.count : g.attributes.position.count) / 3; materials.add(o.material.name); } });

  },
  async details(list = DETAILS, who = 'player') { // who: 'player' | 'opponent' — the same close-ups of either fighter, alone at the origin

  // Both heads side by side from the portrait angles (front, ±35°, ±90°, from below): the face audit for a new fighter.
  async faces() {
    const views = [['front', .0, .08], ['left 35°', .6, .08], ['right 35°', -.6, .08], ['left profile', 1.55, .05], ['right profile', -1.55, .05], ['from below', 0, -.5]];

      other.visible = false; subject.visible = true; subject.position.set(0, 0, 0); subject.rotation.y = 0; scrub(subject, 'Armed', 0); subject.updateWorldMatrix(true, true);
      const target = subject.getObjectByName('Head').getWorldPosition(new THREE.Vector3()).add(new THREE.Vector3(0, .07, .02)), distance = .62;

  },
  async moodboard() {
    const { moodboard } = await import('/scripts/character-moodboard.js');
    return moodboard({ THREE, renderer, camera, arena, studio, cells, player, opponent, scrub, settle, lockCamera, studioCamera, reset, stage, LOCK, GAME_RATIO });
  },
  async turntable() {
    await reset(); stage(studio); opponent.visible = true; renderer.toneMappingExposure = 1;
    player.position.set(-.75, 0, 0); opponent.position.set(.75, 0, 0); scrub(player, 'Armed', 0); scrub(opponent, 'Armed', 0);
    return cells(4, 2, 540, 720, 1, i => { const a = i * Math.PI / 4; player.rotation.y = opponent.rotation.y = a; studioCamera(true); renderer.render(studio, camera); return `turntable ${i * 45}°  Armed t=0  player | opponent`; });
  },
  async clipSheet(list = CLIP_SHEET) {
    await reset(); stage(studio); opponent.visible = false; renderer.toneMappingExposure = 1; player.position.set(0, 0, 0); player.rotation.y = 0;
    return cells(8, Math.ceil(list.length / 8), 360, 480, 1, i => { if (!list[i]) return false; const [name, t] = list[i]; scrub(player, name, t); studioCamera(false, Math.PI / 6); renderer.render(studio, camera); return `${name} t=${t.toFixed(2)}`; });
  },
  async lockStill(orientation, moment) {
    await reset(); stage(arena); opponent.visible = true; renderer.toneMappingExposure = 1.3;
    settle(30); if (moment === 'attack') { settle(14, 'attack:light', 'guard'); tick('attack:light', 'block'); }
    const [w, h] = LOCK[orientation];
    return cells(1, 1, w, h, GAME_RATIO, () => { lockCamera(); renderer.render(arena, camera); return `lock ${w}×${h} @${GAME_RATIO}  ${moment}`; });
  },
  async sequenceSheet(orientation = 'landscape', every = 15, zoom = 1) {
    await reset(); stage(arena); opponent.visible = true; renderer.toneMappingExposure = 1.3;
    const [w, h] = LOCK[orientation], frames = Math.ceil(SEQUENCE_TICKS / every), cols = 6, run = sequence(); let n = 0, current = run.next();
    return cells(cols, Math.ceil(frames / cols), w, h, 1, i => {
      while (!current.done && n < i * every) { tick(...current.value); current = run.next(); n++; }
      if (current.done) return false;
      tick(...current.value); current = run.next(); n++;
      lockCamera(); renderer.render(arena, camera); return `t=${((n - 1) / 60).toFixed(2)}s  ${P.name} | ${O.name}`;
    }, zoom);
  },
  async play(orientation = 'landscape') {
    // Real-time playback on the visible canvas (for video). Not deterministic: wall clock drives tick count.
    await reset(); stage(arena); opponent.visible = true; renderer.toneMappingExposure = 1.3; document.getElementById('bar').hidden = true;
    const [w, h] = LOCK[orientation]; frame(w, h, 1); canvas.style.width = `${w}px`; canvas.style.height = `${h}px`;
    const run = sequence(); let current = run.next(), last = performance.now(), carry = 0;
    await new Promise(resolve => { const loop = now => {
      carry += Math.min(.1, (now - last) / 1000); last = now;
      while (carry >= TICK && !current.done) { tick(...current.value); current = run.next(); carry -= TICK; }

    }; requestAnimationFrame(loop); });

  async stats() {
    await reset(); stage(arena); settle(30);
    const materials = [], textures = new Map(), meshes = []; let bones = 0, boneNames = [];
    warriors.player.anchor.traverse(o => {
      if (o.isSkinnedMesh) { bones = Math.max(bones, o.skeleton.bones.length); boneNames = o.skeleton.bones.map(b => b.name); }
      if (!o.isMesh || !o.name) return; // unnamed = the runtime blade trail, not the asset
      const g = o.geometry; meshes.push({ name: o.name, triangles: (g.index ? g.index.count : g.attributes.position.count) / 3, material: o.material.name });
      if (materials.some(m => m.name === o.material.name)) return;
      const maps = ['map', 'normalMap', 'roughnessMap', 'metalnessMap', 'aoMap', 'emissiveMap'].filter(k => o.material[k]);

    });
    for (const f of arenaFloor) f.visible = false; frame(...LOCK.landscape, GAME_RATIO); lockCamera(); renderer.render(arena, camera);
    const characterOnly = { drawCalls: renderer.info.render.calls, triangles: renderer.info.render.triangles, fighters: 2 };
    for (const f of arenaFloor) f.visible = true;
    return { meshes, materials, textures: [...textures.values()], textureBytes: [...textures.values()].reduce((n, t) => n + t.bytes, 0), bones, boneNames, meshTriangles: meshes.reduce((n, m) => n + m.triangles, 0),
      clips: clips.map(c => ({ name: c.name, duration: +c.duration.toFixed(3), tracks: c.tracks.length })), characterOnly };
  },
  // Material/geometry facts for one named draw, for debugging an asset that renders wrong (maps, alpha, sides, UVs).
  names() { const n = []; warriors.player.anchor.traverse(o => { if (o.isMesh) n.push(`${o.name}:${o.material?.name}:${o.geometry.attributes.position.count}`); }); return n; },
  probe(name) {
    const o = warriors.player.anchor.getObjectByName(name); if (!o) return null;

window.__preview = api;

// Manual mode: live views for a human reviewer (node scripts/character-preview.mjs --serve).
let mode = 'studio', angle = 0, run, current, last = 0, carry = 0, view = [900, 900];
const select = document.getElementById('clip'), scrubInput = document.getElementById('scrub');
function fit(w, h) { view = [w, h]; const s = Math.min(innerWidth / w, (innerHeight - 40) / h); canvas.style.width = `${w * s}px`; canvas.style.height = `${h * s}px`; canvas.style.marginTop = '40px'; }
window.addEventListener('resize', () => fit(...view));
let busy = false;
async function setMode(next) {
  busy = true; mode = next; await reset(); stage(mode === 'studio' || mode === 'clip' ? studio : arena);
  if (mode === 'studio' || mode === 'clip') { renderer.toneMappingExposure = 1; opponent.visible = mode === 'studio'; player.position.set(mode === 'studio' ? -.75 : 0, 0, 0); opponent.position.set(.75, 0, 0); frame(900, 900, Math.min(devicePixelRatio, GAME_RATIO)); fit(900, 900); }
  else { renderer.toneMappingExposure = 1.3; opponent.visible = true; const [w, h] = LOCK[mode]; frame(w, h, Math.min(devicePixelRatio, GAME_RATIO)); fit(w, h); run = sequence(); current = run.next(); carry = 0; }

  if (mode === 'studio') { angle += dt * .6; player.rotation.y = opponent.rotation.y = angle; scrub(player, 'Armed', 0); scrub(opponent, 'Armed', 0); studioCamera(true); renderer.render(studio, camera); }
  else if (mode === 'clip') { const t = +scrubInput.value; scrub(player, select.value, t); document.getElementById('time').textContent = `${(t * clips.find(c => c.name === select.value).duration).toFixed(2)}s`; studioCamera(false, Math.PI / 6); renderer.render(studio, camera); }
  else { carry += dt; while (carry >= TICK) { if (current.done) { run = sequence(); current = run.next(); } tick(...current.value); current = run.next(); carry -= TICK; } lockCamera(); renderer.render(arena, camera); }
}
for (const button of document.querySelectorAll('[data-mode]')) button.addEventListener('click', () => setMode(button.dataset.mode));
try {
  const asset = await new GLTFLoader().loadAsync(SRC || GLB); clips = asset.animations;
  for (const name of SRC ? clips.map(c => c.name) : [...CLIPS, ...COMBAT_CLIPS]) { const o = document.createElement('option'); o.textContent = o.value = name; select.append(o); }
  await setMode('studio'); api.loaded = true; status(`Ready · ${clips.length} clips · sequence ${(SEQUENCE_TICKS / 60).toFixed(1)}s`); requestAnimationFrame(loop);
} catch (error) { api.error = String(error); status(api.error); throw error; }
