<!doctype html>
<!-- Brief 13 review (2026-09-22, Scalable Chars): six ring guards from src/assets/guard.glb on the play circle's wall, equal spacing,
     each its own SkinnedMesh + mixer (skinned meshes cannot be GPU-instanced in three; six clones share geometry and materials).
     Each guard paces the wall, about-faces on the Turn clip, stands, raises and lashes the whip on a staggered schedule, so a frame
     shows every clip somewhere. ?count=4 for the fallback, ?clip=Pace to hold one clip, ?still=1 to freeze after the first pose.
     window.__guard reports frame times for scripts/guard-browser-check.mjs. Review only: the world lane owns the in-game guards. -->
<html lang="en"><head><meta charset="utf-8"><title>Guard preview</title>
<style>html,body{margin:0;height:100%;background:#9ca8a6;font:13px system-ui;color:#222}#status{position:fixed;left:8px;top:8px;white-space:pre}</style></head>
<body><canvas id="world"></canvas><div id="status">loading…</div>
<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { clone } from 'three/addons/utils/SkeletonUtils.js';
const P = new URLSearchParams(location.search), status = t => document.getElementById('status').textContent = t;
const COUNT = Number(P.get('count') || 6), RADIUS = 9.4, HOLD = P.get('clip');
const canvas = document.getElementById('world'), renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.shadowMap.enabled = true;
const pmrem = new THREE.PMREMGenerator(renderer), env = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
const scene = new THREE.Scene(); scene.background = new THREE.Color('#9ca8a6'); scene.fog = new THREE.FogExp2('#9ca8a6', 0.018); scene.environment = env; scene.environmentIntensity = 0.65;
scene.add(new THREE.HemisphereLight('#d2e0e4', '#575c4c', 2.5));
const sun = new THREE.DirectionalLight('#ffdfad', 3.6); sun.position.set(-15, 26, -18); sun.castShadow = true; sun.shadow.mapSize.set(1024, 1024);
Object.assign(sun.shadow.camera, { left: -15, right: 15, top: 15, bottom: -15, near: 1, far: 70 }); scene.add(sun);
const floor = new THREE.Mesh(new THREE.CylinderGeometry(9, 9, 0.1, 80), new THREE.MeshStandardMaterial({ color: '#878579', roughness: 0.98 })); floor.position.y = -0.05; floor.receiveShadow = true; scene.add(floor);
const wall = new THREE.Mesh(new THREE.CylinderGeometry(10.2, 10.2, 1.2, 80, 1, true), new THREE.MeshStandardMaterial({ color: '#555b56', roughness: 1, side: THREE.BackSide })); wall.position.y = 0.6; scene.add(wall);
const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 80); camera.position.set(0, 2.2, 3.5); camera.lookAt(0, 1, -8);   // the fight camera's neighbourhood: guards at the far wall
const asset = await new GLTFLoader().loadAsync(new URL('/src/assets/guard.glb', location.href).href);
const clips = Object.fromEntries(asset.animations.map(c => [c.name, c]));
const guards = [];
for (let i = 0; i < COUNT; i++) {
  const g = clone(asset.scene), a = i / COUNT * Math.PI * 2;
  g.position.set(Math.sin(a) * RADIUS, 0, Math.cos(a) * RADIUS); g.rotation.y = a + Math.PI / 2;   // facing along the wall, paces it
  g.traverse(o => { if (o.isMesh) { o.castShadow = o.receiveShadow = true; o.frustumCulled = false; } });
  const mixer = new THREE.AnimationMixer(g), actions = Object.fromEntries(Object.entries(clips).map(([n, c]) => [n, mixer.clipAction(c)]));
  for (const [n, act] of Object.entries(actions)) if (n === 'Raise' || n === 'Turn' || n === 'Lash') { act.setLoop(THREE.LoopOnce); act.clampWhenFinished = true; }
  scene.add(g); guards.push({ g, mixer, actions, phase: i * 1.7, current: null, heading: g.rotation.y, along: a });
}
const play = (guard, name) => { if (guard.current === name) return; for (const act of Object.values(guard.actions)) act.fadeOut(.15); const act = guard.actions[name]; act.reset().fadeIn(.15).play(); guard.current = name; };
// The schedule, per guard, offset by phase: pace 6 s, turn .6 s (the clip yaws the root; the heading flips when it ends), stand 3 s, raise 1 s, lash .6 s, stand 2 s.
const SCHEDULE = [['Pace', 6], ['Turn', .6], ['Stand', 3], ['Raise', 1], ['Lash', .6], ['Stand', 2]], PERIOD = SCHEDULE.reduce((n, [, d]) => n + d, 0);
const PACE_SPEED = 0.963;   // m/s along the wall while Pace plays: MEASURED off the clip (0.642 m forward foot separation × 2 per 1.333 s cycle), not judged by eye. Anything else skates.
const frames = []; let last = performance.now(), t = 0; const still = P.get('still');
const cpuFrames = [];
function frame(now) {
  const started = performance.now();
  const dt = Math.min(0.1, (now - last) / 1000); last = now; t += dt; frames.push(dt * 1000);
  for (const guard of guards) {
    let at = (t + guard.phase) % PERIOD, name = 'Stand';
    for (const [clip, d] of SCHEDULE) { if (at < d) { name = clip; break; } at -= d; }
    play(guard, HOLD || name);
    if ((HOLD || name) === 'Pace') { guard.along += (guard.flip ? -1 : 1) * PACE_SPEED / RADIUS * dt; guard.g.position.set(Math.sin(guard.along) * RADIUS, 0, Math.cos(guard.along) * RADIUS); guard.g.rotation.y = guard.along + (guard.flip ? -Math.PI / 2 : Math.PI / 2); }
    if (name === 'Turn' && guard.current === 'Turn' && guard.actions.Turn.time >= .59 && !guard.turned) { guard.turned = true; guard.flip = !guard.flip; }
    if (name === 'Pace') guard.turned = false;
    guard.mixer.update(dt);
  }
  const w = innerWidth, h = innerHeight; if (canvas.width !== Math.round(w * renderer.getPixelRatio())) { renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); }
  renderer.render(scene, camera);
  // The work this scene costs the main thread, measured from the top of the frame to after the draw call returns. This is the number
  // that means something: a rAF delta at 60 Hz vsync is the CADENCE, not the cost — it sits at 16.7 ms whether the scene is six guards
  // or nothing at all — so the check asserts on this and reports the deltas only as context.
  cpuFrames.push(performance.now() - started);
  window.__guard = { ready: true, count: guards.length, frames: frames.slice(-600), cpu: cpuFrames.slice(-600), clips: Object.keys(clips), tris: renderer.info.render.triangles, calls: renderer.info.render.calls };
  status(`${guards.length} guards · ${Object.keys(clips).join(' ')} · ${renderer.info.render.triangles} tris · ${renderer.info.render.calls} draws`);
  if (!still || frames.length < 5) requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script></body></html>
