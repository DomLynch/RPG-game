server {
    listen 80;
    listen [::]:80;
    server_name frankendom.com www.frankendom.com;
    root /var/www/frankendom/current;
    location ^~ /.well-known/acme-challenge/ { root /var/www/frankendom/acme; }
    location / { return 301 https://frankendom.com$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.frankendom.com;
    ssl_certificate /etc/letsencrypt/live/frankendom.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/frankendom.com/privkey.pem;
    return 301 https://frankendom.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name frankendom.com;
    root /var/www/frankendom/current;
    index index.html;
    ssl_certificate /etc/letsencrypt/live/frankendom.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/frankendom.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
    gzip on;
    gzip_types application/javascript text/css application/json image/svg+xml;
    location /assets/ { expires 1y; try_files $uri =404; }
    location / { expires -1; try_files $uri =404; }
    location ~ /\. { deny all; }
}
