map $frankendom_og_face $frankendom_og_image {
    "" "https://frankendom.com/game/img/og.jpg";
    default "https://frankendom.com/legends/$frankendom_og_face.webp";
}
map $frankendom_og_face $frankendom_og_size {
    "" '<meta property="og:image:width" content="1200"><meta property="og:image:height" content="630">';
    default '<meta property="og:image:width" content="512"><meta property="og:image:height" content="512">';
}
map $frankendom_og_face $frankendom_og_alt {
    "" "A gladiator stands over a fallen fighter in the sand arena";
    default "The painted face of the legend this fight was against";
}
map $frankendom_og_face $frankendom_og_card {
    "" "summary_large_image";
    default "summary";
}

server {
    listen 80;
    listen [::]:80;
    server_name frankendom.com www.frankendom.com;
    root /var/www/frankendom/current;
    location ^~ /.well-known/acme-challenge/ { root /var/www/frankendom/acme; }
    location / { return 301 https://frankendom.com$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.frankendom.com;
    ssl_certificate /etc/letsencrypt/live/frankendom.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/frankendom.com/privkey.pem;
    return 301 https://frankendom.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name frankendom.com;
    root /var/www/frankendom/current;
    index index.html;
    ssl_certificate /etc/letsencrypt/live/frankendom.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/frankendom.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' blob: https://o4508959368019968.ingest.us.sentry.io https://rxbewmzmovelckzoosss.supabase.co; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
    gzip on;
    gzip_types application/javascript text/css application/json image/svg+xml model/gltf-binary application/octet-stream;
    location /assets/ { expires 1y; try_files $uri =404; }
    # Short share links (beta): frankendom.com/s/<id> is the app itself; the client reads the id from the path.
    # The og tags carry the legend's face when ?l is a whitelisted name (maps above); otherwise each replacement is the text it replaces.
    location ^~ /s/ {
        expires -1;
        sub_filter 'https://frankendom.com/game/img/og.jpg' '$frankendom_og_image';
        sub_filter '<meta property="og:image:width" content="1200"><meta property="og:image:height" content="630">' '$frankendom_og_size';
        sub_filter 'A gladiator stands over a fallen fighter in the sand arena' '$frankendom_og_alt';
        sub_filter 'summary_large_image' '$frankendom_og_card';
        try_files /index.html =404;
    }
    location / { expires -1; try_files $uri $uri/ =404; }
    location ~ /\. { deny all; }
}
