# Kill-link previews with the legend's face (Dom via Strategy, Lead 2026-09-28, option c): /s/<id>?l=<opponent>-<rung> names the fight's
# legend (src/share-store.ts shortLink). A crawler runs no script, so nginx rewrites the static og tags in index.html for /s/ only. The
# whitelist is exact, the 100 names of src/legends.ts PORTRAIT_KEYS (tests/legend-og.test.ts pins it): anything else, or no ?l, maps
# to "" and the page keeps og.jpg at 1200x630 with the large card. A face is the 512 square webp already served under /legends/.
